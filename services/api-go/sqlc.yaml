# sqlc: hand-written SQL in sql/<module>/ compiled against the migrations into
# one typed package per module (internal/<module>/adapters/postgres/sqlcgen).
# `make generate` runs it; `make check` fails when the committed output is
# stale. A module gets its block with its first query (sqlc rejects an empty
# query directory): training and dashboard join in their stories. The type
# overrides are shared through the &overrides anchor.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: sql/identity
    gen:
      go:
        package: sqlcgen
        out: internal/identity/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        # Up to two parameters stay positional; more become a Params struct.
        query_parameter_limit: 2
        # Queries are built per call from Transactor.Querier(ctx).
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        # Every module sees the whole schema; emit only the models its queries use.
        omit_unused_structs: true
        overrides: &overrides
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # numeric(6,1) set values; pgx scans numeric into float64.
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: sql/catalog
    gen:
      go:
        package: sqlcgen
        out: internal/catalog/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        query_parameter_limit: 2
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides: *overrides
