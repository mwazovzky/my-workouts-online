# Static SPA build with history-mode fallback. Hashed assets are long-lived.
# `expires` is used instead of `add_header Cache-Control` so the server-level
# security headers keep applying inside these locations.
location /assets/ {
    expires 30d;
    try_files $uri =404;
}

location = /sitemap.xml {
    types { }
    default_type application/xml;
    expires 1h;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ @spa;
}

# A missing path with a file extension (/missing.xml, /wp-login.php) is a
# real 404; any other path is a client route and gets the SPA shell, whose
# not-found page marks itself noindex.
location @spa {
    if ($uri ~ "\.[^/]+$") {
        return 404;
    }
    rewrite ^ /index.html last;
}
