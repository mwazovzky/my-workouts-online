# Apple App Site Association for Universal Links (iOS app). The file is
# rendered by docker/web/start.sh from APPLE_APP_ID; an empty id renders a
# valid document with no app links, so the route is always well-formed.
# Apple fetches it over HTTPS without following redirects and requires
# application/json. The exact match wins over the SPA fallback.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    expires 1h;
    alias /etc/nginx/apple-app-site-association;
}
