# X-Robots-Tag for the SPA's signed-in and auth routes, so a crawler that
# follows a link there does not index the login redirect. robots.txt does not
# disallow them: a crawler must fetch a page to see its noindex. Matched on
# $request_uri, which keeps the original path after the fallback to
# spa.html. apps/web/src/lib/crawl.test.js checks this list against the
# router. Include at http level, then `add_header X-Robots-Tag $robots_tag
# always;` in the server; an empty value sends no header.
map $request_uri $robots_tag {
    default "";
    "~^/(dashboard|about|programs|workout-templates|workouts|profile|admin|login|register|forgot-password|reset-password|verify-email|confirm-password)(/|\?|$)" "noindex";
}
