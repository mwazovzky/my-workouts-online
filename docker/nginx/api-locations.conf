# Routes owned by the API backend. Everything else is the SPA.
# The backend is reached over FastCGI with a fixed front controller, so nginx
# never needs the PHP files; swapping the backend for another implementation
# is a change to this file and the upstream only.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location ~ ^/(api|health|up)(/|$)|^/\.well-known/jwks\.json$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass php_api;
    fastcgi_read_timeout 60s;
}
