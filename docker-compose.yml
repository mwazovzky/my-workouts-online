services:
  app:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
      target: app-dev
    env_file:
      - .env
    environment:
      # The shared YAML catalog (catalog:export).
      CATALOG_EXPORT_PATH: /var/www/catalog
    volumes:
      - ./services/api-php:/var/www/html
      - ./catalog:/var/www/catalog
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - node
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      PHP_FPM_UPSTREAM: ${PHP_FPM_UPSTREAM:-app:9000}
      SPA_UPSTREAM: node:5174
    volumes:
      - ./docker/nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/api-locations.conf:/etc/nginx/api-locations.conf:ro
      - ./docker/nginx/well-known-locations.conf:/etc/nginx/well-known-locations.conf:ro
      - ./docker/web/apple-app-site-association.empty:/etc/nginx/apple-app-site-association:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Go API (services/api-go), not routed by nginx yet: http://localhost:8081.
  # Code changes need `docker compose restart api-go`; tools run in it too
  # (`docker compose exec -T api-go make check`).
  api-go:
    build:
      context: .
      dockerfile: ./docker/api-go/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable
      # Tests create and drop their own databases on this server instead of
      # starting a testcontainers Postgres (no Docker inside this container).
      TEST_DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/postgres?sslmode=disable
      # The shared YAML catalog `catalog sync` and `seed` apply.
      CATALOG_DIR: /src/catalog
    ports:
      - "8081:8081"
      # The admin listener: /metrics and /health/ready.
      - "9090:9090"
    volumes:
      - ./:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy

  # The Go API's job worker (`workouts work`): forwards support email the Go
  # webhook queued. Same toolchain image and bind mount as api-go; it migrates
  # too (goose locks, so the two never apply a migration twice) and execs the
  # binary so SIGTERM reaches it.
  worker-go:
    build:
      context: .
      dockerfile: ./docker/api-go/Dockerfile
      target: dev
    command: ["sh", "-c", "go build -o /tmp/workouts ./cmd/workouts && /tmp/workouts migrate up && exec /tmp/workouts work"]
    ports:
      # The worker's admin listener: /metrics (jobs_active, jobs_failed_total).
      - "9091:9090"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable
    volumes:
      - ./:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  node:
    image: node:20-alpine
    working_dir: /var/www/html/apps/web
    ports:
      - "5174:5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://nginx
    volumes:
      - ./:/var/www/html
      - web_node_modules:/var/www/html/apps/web/node_modules
    command: >
      sh -lc 'if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then npm ci; fi; npm run dev -- --host 0.0.0.0 --port 5174'

volumes:
  mysql_data:
  web_node_modules:
  postgres_data:
  go_mod_cache:
  go_build_cache:
