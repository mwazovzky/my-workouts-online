services:
  app:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
      target: app-dev
    env_file:
      - .env
    volumes:
      - ./services/api-php:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - node
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      PHP_FPM_UPSTREAM: ${PHP_FPM_UPSTREAM:-app:9000}
      SPA_UPSTREAM: node:5174
    volumes:
      - ./docker/nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/api-locations.conf:/etc/nginx/api-locations.conf:ro
      - ./docker/nginx/well-known-locations.conf:/etc/nginx/well-known-locations.conf:ro
      - ./docker/web/apple-app-site-association.empty:/etc/nginx/apple-app-site-association:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  node:
    image: node:20-alpine
    working_dir: /var/www/html/apps/web
    ports:
      - "5174:5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://nginx
    volumes:
      - ./:/var/www/html
      - web_node_modules:/var/www/html/apps/web/node_modules
    command: >
      sh -lc 'if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then npm ci; fi; npm run dev -- --host 0.0.0.0 --port 5174'

volumes:
  mysql_data:
  web_node_modules:
