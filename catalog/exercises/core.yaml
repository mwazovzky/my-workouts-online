- slug: plank
  equipment: bodyweight
  effort_type: duration
  rest_time_seconds: 60
  categories: [core]
  translations:
    en:
      name: Plank
      description: 'Support yourself on your forearms and toes with your elbows under your shoulders. Hold your body in a straight line from head to heels, bracing your abs and glutes. Stop when your hips start to sag.'
    ru:
      name: Планка
      description: 'Примите упор на предплечьях и носках, локти под плечами. Удерживайте тело прямой линией от головы до пяток, напрягая пресс и ягодицы. Заканчивайте подход, когда таз начинает провисать.'
- slug: crunch
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: Crunch
      description: 'Lie on your back with your knees bent and your hands by your temples. Curl your shoulders off the floor by tightening your abs, pause, then lower slowly. Do not pull on your neck.'
    ru:
      name: Скручивания
      description: 'Лягте на спину, согнув колени, руки у висков. Оторвите лопатки от пола за счёт напряжения пресса, задержитесь и медленно опуститесь. Не тяните себя за шею.'
  previous_names: [Crunches]
- slug: side-plank
  equipment: bodyweight
  effort_type: duration
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Side Plank'
      description: 'Lie on your side and support yourself on your forearm with your elbow under your shoulder. Raise your hips until your body is in a straight line and hold. Repeat on the other side.'
    ru:
      name: 'Боковая планка'
      description: 'Лягте на бок и обопритесь на предплечье, локоть под плечом. Поднимите таз до прямой линии тела и удерживайте положение. Повторите на другую сторону.'
- slug: hollow-body-hold
  equipment: bodyweight
  effort_type: duration
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Hollow Body Hold'
      description: 'Lie on your back and press your lower back into the floor. Raise your shoulders and your straight legs a little off the floor, arms stretched past your head, and hold. Bend your knees if your lower back lifts.'
    ru:
      name: 'Лодочка на спине'
      description: 'Лягте на спину и прижмите поясницу к полу. Приподнимите плечи и прямые ноги над полом, руки вытянуты за голову, и удерживайте положение. Если поясница отрывается от пола, согните колени.'
- slug: dead-bug
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Dead Bug'
      description: 'Lie on your back with your arms pointing at the ceiling and your knees bent above your hips. Lower one arm and the opposite leg toward the floor, keeping your lower back pressed down, then return and change sides.'
    ru:
      name: 'Мёртвый жук'
      description: 'Лягте на спину, руки подняты вверх, колени согнуты над тазом. Опустите одну руку и противоположную ногу к полу, удерживая поясницу прижатой, вернитесь и смените сторону.'
- slug: bird-dog
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core, back]
  translations:
    en:
      name: 'Bird Dog'
      description: 'Start on your hands and knees with a flat back. Stretch one arm forward and the opposite leg back until both are level with your torso, pause, then return and change sides. Keep your hips level.'
    ru:
      name: Птица-собака
      description: 'Встаньте на четвереньки, спина прямая. Вытяните одну руку вперёд, а противоположную ногу назад до уровня корпуса, задержитесь, вернитесь и смените сторону. Таз остаётся ровным.'
- slug: bicycle-crunch
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Bicycle Crunch'
      description: 'Lie on your back with your hands by your temples and your legs raised. Bring one knee toward your chest while turning your opposite elbow toward it, then change sides in a pedalling motion.'
    ru:
      name: Велосипед
      description: 'Лягте на спину, руки у висков, ноги приподняты. Подтяните одно колено к груди, одновременно разворачивая к нему противоположный локоть, затем смените сторону, как при езде на велосипеде.'
- slug: reverse-crunch
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Reverse Crunch'
      description: 'Lie on your back with your knees bent above your hips and your arms at your sides. Curl your hips off the floor to bring your knees toward your chest, then lower them slowly.'
    ru:
      name: 'Обратные скручивания'
      description: 'Лягте на спину, колени согнуты над тазом, руки вдоль тела. Оторвите таз от пола, подтягивая колени к груди, и медленно опуститесь.'
- slug: lying-leg-raise
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Lying Leg Raise'
      description: 'Lie on your back with your legs straight and your hands under your hips. Raise your legs until they point at the ceiling, then lower them slowly without letting your heels touch the floor. Keep your lower back pressed down.'
    ru:
      name: 'Подъём ног лёжа'
      description: 'Лягте на спину, ноги прямые, ладони под тазом. Поднимите ноги до вертикали и медленно опустите, не касаясь пятками пола. Поясница прижата к полу.'
- slug: russian-twist
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Russian Twist'
      description: 'Sit with your knees bent and lean back until you feel your abs tighten. Turn your torso to one side, then the other, touching the floor beside your hip each time. Lift your feet off the floor to make it harder.'
    ru:
      name: 'Русские скручивания'
      description: 'Сядьте, согнув колени, и отклонитесь назад до напряжения пресса. Поворачивайте корпус из стороны в сторону, каждый раз касаясь руками пола рядом с тазом. Чтобы увеличить нагрузку, оторвите стопы от пола.'
- slug: mountain-climber
  equipment: bodyweight
  effort_type: duration
  rest_time_seconds: 45
  categories: [core, full-body]
  translations:
    en:
      name: 'Mountain Climber'
      description: 'Start in a push-up position with your arms straight. Bring one knee toward your chest, then switch legs quickly as if running on the spot. Keep your hips level with your shoulders.'
    ru:
      name: Альпинист
      description: 'Примите упор лёжа на прямых руках. Подтяните одно колено к груди и быстро меняйте ноги, как при беге на месте. Таз остаётся на уровне плеч.'
- slug: hanging-knee-raise
  equipment: pull-up-bar
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [core]
  translations:
    en:
      name: 'Hanging Knee Raise'
      description: 'Hang from the bar with your arms straight. Raise your knees toward your chest by curling your hips up, then lower your legs slowly. Avoid swinging.'
    ru:
      name: 'Подъём коленей в висе'
      description: 'Повисните на перекладине на прямых руках. Подтяните колени к груди, подкручивая таз вверх, и медленно опустите ноги. Не раскачивайтесь.'
- slug: hanging-leg-raise
  equipment: pull-up-bar
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [core]
  translations:
    en:
      name: 'Hanging Leg Raise'
      description: 'Hang from the bar with your arms straight. Raise your straight legs until they are parallel to the floor, then lower them slowly. Avoid swinging.'
    ru:
      name: 'Подъём ног в висе'
      description: 'Повисните на перекладине на прямых руках. Поднимите прямые ноги до параллели с полом и медленно опустите. Не раскачивайтесь.'
- slug: ab-wheel-rollout
  equipment: ab-wheel
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [core]
  translations:
    en:
      name: 'Ab Wheel Rollout'
      description: 'Kneel on the floor holding the wheel under your shoulders. Roll forward as far as you can without letting your hips sag, then pull the wheel back toward your knees. Start with a short range.'
    ru:
      name: 'Прокат ролика для пресса'
      description: 'Встаньте на колени, ролик под плечами. Прокатите ролик вперёд настолько далеко, насколько можете без провисания таза, и верните его к коленям. Начинайте с небольшой амплитуды.'
- slug: cable-crunch
  equipment: cable-machine
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [core]
  translations:
    en:
      name: 'Cable Crunch'
      description: 'Kneel facing the high pulley and hold the rope beside your head. Curl your torso down by tightening your abs until your elbows reach your thighs, then return slowly. Keep your hips still.'
    ru:
      name: 'Скручивания на блоке'
      description: 'Встаньте на колени лицом к верхнему блоку и удерживайте канат у головы. Скрутите корпус вниз за счёт напряжения пресса, пока локти не приблизятся к бёдрам, и медленно вернитесь. Таз остаётся неподвижным.'
- slug: cable-woodchop
  equipment: cable-machine
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [core]
  translations:
    en:
      name: 'Cable Woodchop'
      description: 'Stand side-on to the high pulley and hold the handle with both hands. Pull it down and across your body to the opposite hip, turning your torso, then return slowly. Finish all repetitions before changing sides.'
    ru:
      name: 'Дровосек на блоке'
      description: 'Встаньте боком к верхнему блоку и возьмитесь за рукоять обеими руками. Потяните её вниз по диагонали к противоположному бедру, разворачивая корпус, и медленно вернитесь. Выполните все повторения, затем смените сторону.'
- slug: band-pallof-press
  equipment: resistance-band
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [core]
  translations:
    en:
      name: 'Band Pallof Press'
      description: 'Anchor the band at chest height and stand side-on to it, holding the end against your chest with both hands. Press your hands straight out, resist the pull that tries to turn you, then bring them back. Finish all repetitions before changing sides.'
    ru:
      name: 'Жим Паллофа с эспандером'
      description: 'Закрепите эспандер на уровне груди и встаньте боком к нему, удерживая конец у груди обеими руками. Выпрямите руки перед собой, не давая эспандеру развернуть корпус, и верните их к груди. Выполните все повторения, затем смените сторону.'
