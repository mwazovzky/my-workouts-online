- slug: dumbbell-curl
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'Dumbbell Curl'
      description: 'Stand with a dumbbell in each hand, palms facing forward. Curl the dumbbells toward your shoulders while keeping your elbows at your sides, then lower them slowly until your arms are straight.'
    ru:
      name: 'Сгибание рук с гантелями'
      description: 'Встаньте прямо, гантели в опущенных руках, ладони направлены вперёд. Согните руки, поднимая гантели к плечам и удерживая локти у корпуса, затем медленно опустите до выпрямления рук.'
- slug: barbell-curl
  equipment: barbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'Barbell Curl'
      description: 'Stand holding the bar with an underhand grip at shoulder width. Curl the bar toward your shoulders without moving your elbows forward, then lower it slowly. Keep your torso still.'
    ru:
      name: 'Сгибание рук со штангой'
      description: 'Встаньте прямо и возьмите штангу обратным хватом на ширине плеч. Согните руки, поднимая штангу к плечам и не выводя локти вперёд, затем медленно опустите. Корпус неподвижен.'
- slug: hammer-curl
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps, forearms]
  translations:
    en:
      name: 'Hammer Curl'
      description: 'Stand with a dumbbell in each hand, palms facing each other. Curl the dumbbells toward your shoulders without turning your wrists, then lower them slowly. This grip also works the forearms.'
    ru:
      name: 'Молотковые сгибания'
      description: 'Встаньте прямо, гантели в опущенных руках, ладони обращены друг к другу. Согните руки, поднимая гантели к плечам и не разворачивая кисти, затем медленно опустите. Такой хват дополнительно нагружает предплечья.'
- slug: dumbbell-triceps-extension
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [triceps]
  translations:
    en:
      name: 'Dumbbell Overhead Triceps Extension'
      description: 'Hold one dumbbell with both hands and press it overhead. Lower it behind your head by bending your elbows, keeping them pointing up, then straighten your arms again.'
    ru:
      name: 'Разгибание рук с гантелью из-за головы'
      description: 'Возьмите одну гантель обеими руками и поднимите её над головой. Опустите гантель за голову, сгибая руки в локтях и не разводя локти в стороны, затем выпрямите руки.'
  previous_names: ['Triceps Extension with Dumbbell']
- slug: cable-triceps-pushdown
  equipment: cable-machine
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [triceps]
  translations:
    en:
      name: 'Cable Triceps Pushdown'
      description: 'Stand facing the high pulley and grip the bar or rope with your elbows at your sides. Push down until your arms are straight, then let the handle rise slowly until your forearms are just above horizontal. Only your forearms move.'
    ru:
      name: 'Разгибание рук на блоке'
      description: 'Встаньте лицом к верхнему блоку и возьмитесь за рукоять или канат, прижав локти к корпусу. Разогните руки до полного выпрямления, затем медленно верните рукоять, пока предплечья не окажутся чуть выше горизонтали. Двигаются только предплечья.'
  previous_names: ['Triceps Extension on High Pulley Machine']
- slug: ez-bar-curl
  equipment: ez-bar
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'EZ-Bar Curl'
      description: 'Stand holding the angled part of the bar with an underhand grip. Curl the bar toward your shoulders while keeping your elbows at your sides, then lower it slowly. The angled grip is easier on the wrists than a straight bar.'
    ru:
      name: 'Сгибание рук с EZ-грифом'
      description: 'Встаньте прямо и возьмитесь обратным хватом за изогнутую часть грифа. Согните руки, поднимая гриф к плечам и удерживая локти у корпуса, и медленно опустите. Изогнутый гриф меньше нагружает запястья, чем прямой.'
- slug: ez-bar-preacher-curl
  equipment: ez-bar
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'EZ-Bar Preacher Curl'
      description: 'Sit at the preacher bench with your upper arms resting on the pad. Curl the bar toward your shoulders, then lower it slowly until your arms are almost straight. The pad stops you from swinging.'
    ru:
      name: 'Сгибание рук на скамье Скотта'
      description: 'Сядьте за скамью Скотта, положив руки от плеча до локтя на подушку. Согните руки, поднимая гриф к плечам, и медленно опустите почти до выпрямления рук. Подушка не даёт помогать себе раскачкой.'
- slug: incline-dumbbell-curl
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'Incline Dumbbell Curl'
      description: 'Sit back on a bench set to about 60 degrees and let your arms hang straight down. Curl the dumbbells toward your shoulders without moving your elbows forward, then lower them slowly. The stretched start makes a light weight feel heavy.'
    ru:
      name: 'Сгибание рук с гантелями на наклонной скамье'
      description: 'Сядьте на скамью с наклоном спинки около 60 градусов, руки свободно опущены вниз. Согните руки, поднимая гантели к плечам и не выводя локти вперёд, и медленно опустите. Из-за растянутого исходного положения даже небольшой вес ощущается тяжёлым.'
- slug: concentration-curl
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'Concentration Curl'
      description: 'Sit on a bench and rest the back of your upper arm against the inside of your thigh. Curl the dumbbell toward your shoulder, pause, then lower it slowly. Finish all repetitions before changing arms.'
    ru:
      name: 'Концентрированное сгибание'
      description: 'Сядьте на скамью и упритесь тыльной стороной руки выше локтя во внутреннюю поверхность бедра. Согните руку, поднимая гантель к плечу, задержитесь и медленно опустите. Выполните все повторения, затем смените руку.'
- slug: cable-curl
  equipment: cable-machine
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [biceps]
  translations:
    en:
      name: 'Cable Curl'
      description: 'Stand facing the low pulley and hold the bar with an underhand grip. Curl the bar toward your shoulders while keeping your elbows at your sides, then lower it slowly.'
    ru:
      name: 'Сгибание рук на нижнем блоке'
      description: 'Встаньте лицом к нижнему блоку и возьмитесь за рукоять обратным хватом. Согните руки, поднимая рукоять к плечам и удерживая локти у корпуса, и медленно опустите.'
- slug: band-curl
  equipment: resistance-band
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [biceps]
  translations:
    en:
      name: 'Band Curl'
      description: 'Stand on the middle of the band and hold the ends with your palms facing forward. Curl your hands toward your shoulders while keeping your elbows at your sides, then lower them slowly.'
    ru:
      name: 'Сгибание рук с эспандером'
      description: 'Встаньте на середину эспандера и возьмите концы в руки, ладони направлены вперёд. Согните руки, поднимая кисти к плечам и удерживая локти у корпуса, и медленно опустите.'
- slug: ez-bar-reverse-curl
  equipment: ez-bar
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [forearms, biceps]
  translations:
    en:
      name: 'EZ-Bar Reverse Curl'
      description: 'Stand holding the bar with an overhand grip at shoulder width. Curl the bar toward your shoulders while keeping your elbows at your sides and your wrists straight, then lower it slowly.'
    ru:
      name: 'Сгибание рук прямым хватом'
      description: 'Встаньте прямо и возьмитесь за гриф прямым хватом на ширине плеч. Согните руки, поднимая гриф к плечам, локти у корпуса, запястья прямые, и медленно опустите.'
- slug: close-grip-bench-press
  equipment: barbell
  effort_type: repetitions
  rest_time_seconds: 120
  categories: [triceps, chest]
  translations:
    en:
      name: 'Close-Grip Bench Press'
      description: 'Lie on a flat bench and grip the bar at shoulder width. Lower the bar to your lower chest with your elbows close to your body, then press it up until your arms are straight.'
    ru:
      name: 'Жим штанги узким хватом'
      description: 'Лягте на горизонтальную скамью и возьмитесь за гриф на ширине плеч. Опустите штангу к нижней части груди, ведя локти вдоль корпуса, и выжмите её до выпрямления рук.'
- slug: ez-bar-skull-crusher
  equipment: ez-bar
  effort_type: repetitions
  rest_time_seconds: 90
  categories: [triceps]
  translations:
    en:
      name: 'EZ-Bar Skull Crusher'
      description: 'Lie on a flat bench holding the bar above your chest with straight arms. Bend your elbows to lower the bar toward your forehead, keeping your upper arms still, then straighten your arms.'
    ru:
      name: 'Французский жим лёжа'
      description: 'Лягте на горизонтальную скамью, гриф над грудью на прямых руках. Согните локти, опуская гриф ко лбу и не двигая руками выше локтя, затем выпрямите руки.'
- slug: triceps-dip
  equipment: dip-bars
  effort_type: repetitions
  rest_time_seconds: 120
  categories: [triceps, chest]
  translations:
    en:
      name: 'Triceps Dip'
      description: 'Support yourself on the bars with your arms straight and your torso upright. Lower yourself until your elbows are bent to about 90 degrees, keeping them close to your body, then push back up.'
    ru:
      name: 'Отжимания на брусьях на трицепс'
      description: 'Примите упор на брусьях на прямых руках, корпус вертикален. Опуститесь до сгибания локтей примерно под 90 градусов, удерживая их у корпуса, и отожмитесь.'
- slug: bench-dip
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [triceps]
  translations:
    en:
      name: 'Bench Dip'
      description: 'Sit on the edge of a bench or chair, place your hands beside your hips and slide forward off the edge. Lower yourself by bending your elbows to about 90 degrees, then push back up. Bend your knees to make it easier.'
    ru:
      name: 'Обратные отжимания от скамьи'
      description: 'Сядьте на край скамьи или стула, поставьте ладони рядом с тазом и сместитесь вперёд, сняв таз с опоры. Опуститесь, сгибая локти примерно до 90 градусов, и отожмитесь. Чтобы облегчить упражнение, согните колени.'
- slug: diamond-push-up
  equipment: bodyweight
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [triceps, chest]
  translations:
    en:
      name: 'Diamond Push-up'
      description: 'Start in a push-up position with your hands together under your chest, thumbs and index fingers touching. Lower your chest to your hands with your elbows close to your body, then push back up.'
    ru:
      name: 'Алмазные отжимания'
      description: 'Примите упор лёжа, ладони вместе под грудью, большие и указательные пальцы соприкасаются. Опустите грудь к кистям, удерживая локти у корпуса, и отожмитесь.'
- slug: cable-overhead-triceps-extension
  equipment: cable-machine
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [triceps]
  translations:
    en:
      name: 'Cable Overhead Triceps Extension'
      description: 'Stand with your back to the pulley, holding the rope behind your head with your elbows pointing forward. Straighten your arms to push the rope forward and up, then return slowly.'
    ru:
      name: 'Разгибание рук на блоке из-за головы'
      description: 'Встаньте спиной к блоку, удерживая канат за головой, локти направлены вперёд. Выпрямите руки, выводя канат вперёд и вверх, и медленно вернитесь.'
- slug: dumbbell-triceps-kickback
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 60
  categories: [triceps]
  translations:
    en:
      name: 'Dumbbell Triceps Kickback'
      description: 'Hinge forward with a flat back and hold your upper arm against your side, elbow bent. Straighten your arm behind you until it is parallel to the floor, pause, then lower the dumbbell. Only your forearm moves.'
    ru:
      name: 'Разгибание руки с гантелью в наклоне'
      description: 'Наклонитесь вперёд с прямой спиной и прижмите руку к корпусу, согнув её в локте. Выпрямите руку назад до параллели с полом, задержитесь и опустите гантель. Двигается только предплечье.'
- slug: band-triceps-pushdown
  equipment: resistance-band
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [triceps]
  translations:
    en:
      name: 'Band Triceps Pushdown'
      description: 'Anchor the band above your head and hold an end in each hand with your elbows at your sides. Push your hands down until your arms are straight, then let them rise slowly. Only your forearms move.'
    ru:
      name: 'Разгибание рук с эспандером'
      description: 'Закрепите эспандер над головой и возьмите концы в руки, прижав локти к корпусу. Разогните руки до полного выпрямления и медленно вернитесь. Двигаются только предплечья.'
- slug: dumbbell-wrist-curl
  equipment: dumbbell
  effort_type: repetitions
  rest_time_seconds: 45
  categories: [forearms]
  translations:
    en:
      name: 'Dumbbell Wrist Curl'
      description: 'Sit with your forearms resting on your thighs and your hands past your knees, palms up. Let the dumbbells roll down to your fingertips, then curl your wrists up as far as they go.'
    ru:
      name: 'Сгибание кистей с гантелями'
      description: 'Сядьте, положив предплечья на бёдра так, чтобы кисти выступали за колени, ладони обращены вверх. Дайте гантелям скатиться к кончикам пальцев, затем согните кисти вверх до упора.'
- slug: plate-pinch-hold
  equipment: weight-plate
  effort_type: duration
  rest_time_seconds: 60
  categories: [forearms]
  translations:
    en:
      name: 'Plate Pinch Hold'
      description: 'Pinch a weight plate between your thumb and fingers and hold it at your side with a straight arm. Hold for the set time, then change hands. Put the plate down before it slips.'
    ru:
      name: 'Удержание диска щипковым хватом'
      description: 'Зажмите диск между большим и остальными пальцами и удерживайте его у бедра на прямой руке. Держите заданное время, затем смените руку. Опустите диск до того, как он начнёт выскальзывать.'
