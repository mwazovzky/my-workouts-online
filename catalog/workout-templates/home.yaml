# Templates for training at home: bodyweight, one pair of dumbbells,
# a resistance band or a single kettlebell. No weight is prescribed.

- slug: home-bodyweight-full-body-a
  translations:
    en:
      name: 'Bodyweight Full Body A'
      description: 'A first session that needs no equipment and little space. Push-ups are done with your hands on a chair or table.'
    ru:
      name: 'Всё тело с собственным весом А'
      description: 'Первая тренировка, для которой не нужно оборудование и много места. Отжимания выполняются с упором руками на стул или стол.'
  activities:
    - { exercise: bodyweight-squat, sets: 3, effort: 15 }
    - { exercise: incline-push-up, sets: 3, effort: 10 }
    - { exercise: glute-bridge, sets: 3, effort: 15 }
    - { exercise: superman, sets: 3, effort: 12 }
    - { exercise: plank, sets: 3, effort: 30 }
- slug: home-bodyweight-full-body-b
  translations:
    en:
      name: 'Bodyweight Full Body B'
      description: 'The second equipment-free session. You need a sturdy chair for the dips and a wall for the wall sit.'
    ru:
      name: 'Всё тело с собственным весом Б'
      description: 'Вторая тренировка без оборудования. Понадобятся устойчивый стул для обратных отжиманий и стена для «стульчика».'
  activities:
    - { exercise: reverse-lunge, sets: 3, effort: 10 }
    - { exercise: knee-push-up, sets: 3, effort: 10 }
    - { exercise: bird-dog, sets: 3, effort: 10 }
    - { exercise: bench-dip, sets: 3, effort: 10 }
    - { exercise: dead-bug, sets: 3, effort: 10 }
    - { exercise: wall-sit, sets: 3, effort: 30 }
- slug: home-bodyweight-upper
  translations:
    en:
      name: 'Bodyweight Upper Body'
      description: 'Push-ups and pull-ups in several variations. You need a pull-up bar.'
    ru:
      name: 'Верх тела с собственным весом'
      description: 'Отжимания и подтягивания в нескольких вариантах. Понадобится турник.'
  activities:
    - { exercise: push-up, sets: 4, effort: 12 }
    - { exercise: pull-up, sets: 4, effort: 6 }
    - { exercise: pike-push-up, sets: 3, effort: 8 }
    - { exercise: chin-up, sets: 3, effort: 6 }
    - { exercise: diamond-push-up, sets: 3, effort: 10 }
    - { exercise: hanging-knee-raise, sets: 3, effort: 12 }
- slug: home-bodyweight-lower
  translations:
    en:
      name: 'Bodyweight Lower Body'
      description: 'Jumps, lunges and single-leg work for the legs and glutes, with no equipment.'
    ru:
      name: 'Низ тела с собственным весом'
      description: 'Прыжки, выпады и упражнения на одной ноге для ног и ягодиц, без оборудования.'
  activities:
    - { exercise: jump-squat, sets: 3, effort: 12 }
    - { exercise: walking-lunge, sets: 3, effort: 20 }
    - { exercise: single-leg-glute-bridge, sets: 3, effort: 12 }
    - { exercise: bodyweight-calf-raise, sets: 3, effort: 20 }
    - { exercise: wall-sit, sets: 3, effort: 45 }
    - { exercise: side-plank, sets: 3, effort: 30 }
- slug: home-bodyweight-conditioning
  translations:
    en:
      name: 'Bodyweight Conditioning'
      description: 'Fast whole-body movements with short rests to raise your heart rate. Keep moving at a pace you can hold.'
    ru:
      name: 'Выносливость с собственным весом'
      description: 'Быстрые движения на всё тело с коротким отдыхом, которые поднимают пульс. Двигайтесь в темпе, который можете удерживать.'
  activities:
    - { exercise: burpee, sets: 4, effort: 10 }
    - { exercise: mountain-climber, sets: 4, effort: 30 }
    - { exercise: jumping-jack, sets: 4, effort: 45 }
    - { exercise: bear-crawl, sets: 3, effort: 30 }
    - { exercise: hollow-body-hold, sets: 3, effort: 30 }
    - { exercise: bicycle-crunch, sets: 3, effort: 20 }
- slug: home-dumbbell-full-body-a
  translations:
    en:
      name: 'Dumbbell Full Body A'
      description: 'A whole-body session with one pair of dumbbells. A chair can stand in for the bench in the row.'
    ru:
      name: 'Всё тело с гантелями А'
      description: 'Тренировка на всё тело с одной парой гантелей. В тяге гантели скамью можно заменить стулом.'
  activities:
    - { exercise: dumbbell-goblet-squat, sets: 3, effort: 12 }
    - { exercise: push-up, sets: 3, effort: 12 }
    - { exercise: dumbbell-row, sets: 3, effort: 10 }
    - { exercise: dumbbell-shoulder-press, sets: 3, effort: 10 }
    - { exercise: dumbbell-romanian-deadlift, sets: 3, effort: 12 }
    - { exercise: plank, sets: 3, effort: 45 }
- slug: home-dumbbell-full-body-b
  translations:
    en:
      name: 'Dumbbell Full Body B'
      description: 'The second dumbbell session, with lunges, thrusters and work for the arms.'
    ru:
      name: 'Всё тело с гантелями Б'
      description: 'Вторая тренировка с гантелями: выпады, трастеры и упражнения для рук.'
  activities:
    - { exercise: dumbbell-lunge, sets: 3, effort: 10 }
    - { exercise: dumbbell-thruster, sets: 3, effort: 10 }
    - { exercise: dumbbell-rear-delt-fly, sets: 3, effort: 15 }
    - { exercise: dumbbell-curl, sets: 3, effort: 12 }
    - { exercise: dumbbell-triceps-extension, sets: 3, effort: 12 }
    - { exercise: russian-twist, sets: 3, effort: 20 }
- slug: home-dumbbell-upper
  translations:
    en:
      name: 'Dumbbell Upper Body'
      description: 'Shoulders, back, chest and arms with one pair of dumbbells.'
    ru:
      name: 'Верх тела с гантелями'
      description: 'Плечи, спина, грудь и руки с одной парой гантелей.'
  activities:
    - { exercise: dumbbell-shoulder-press, sets: 4, effort: 10 }
    - { exercise: dumbbell-row, sets: 4, effort: 10 }
    - { exercise: push-up, sets: 3, effort: 15 }
    - { exercise: dumbbell-lateral-raise, sets: 3, effort: 15 }
    - { exercise: dumbbell-curl, sets: 3, effort: 12 }
    - { exercise: dumbbell-triceps-kickback, sets: 3, effort: 12 }
- slug: home-dumbbell-lower
  translations:
    en:
      name: 'Dumbbell Lower Body'
      description: 'Legs and glutes with one pair of dumbbells. You need a step or a sturdy chair.'
    ru:
      name: 'Низ тела с гантелями'
      description: 'Ноги и ягодицы с одной парой гантелей. Понадобится ступенька или устойчивый стул.'
  activities:
    - { exercise: dumbbell-goblet-squat, sets: 4, effort: 12 }
    - { exercise: dumbbell-romanian-deadlift, sets: 4, effort: 12 }
    - { exercise: dumbbell-bulgarian-split-squat, sets: 3, effort: 10 }
    - { exercise: dumbbell-step-up, sets: 3, effort: 10 }
    - { exercise: dumbbell-calf-raise, sets: 3, effort: 15 }
    - { exercise: lying-leg-raise, sets: 3, effort: 12 }
- slug: home-band-full-body-a
  translations:
    en:
      name: 'Band Full Body A'
      description: 'The main movements with a resistance band: squat, press, row and deadlift. You need somewhere to anchor the band at chest height.'
    ru:
      name: 'Всё тело с эспандером А'
      description: 'Основные движения с эспандером: приседания, жимы и тяги. Понадобится место, где можно закрепить эспандер на уровне груди.'
  activities:
    - { exercise: band-squat, sets: 3, effort: 15 }
    - { exercise: band-chest-press, sets: 3, effort: 15 }
    - { exercise: band-row, sets: 3, effort: 15 }
    - { exercise: band-overhead-press, sets: 3, effort: 12 }
    - { exercise: band-deadlift, sets: 3, effort: 15 }
    - { exercise: band-pallof-press, sets: 3, effort: 10 }
- slug: home-band-full-body-b
  translations:
    en:
      name: 'Band Full Body B'
      description: 'The second band session, with work for the glutes, upper back, shoulders and arms. You need an anchor point above your head.'
    ru:
      name: 'Всё тело с эспандером Б'
      description: 'Вторая тренировка с эспандером: ягодицы, верх спины, плечи и руки. Понадобится точка крепления над головой.'
  activities:
    - { exercise: band-lateral-walk, sets: 3, effort: 20 }
    - { exercise: band-lat-pulldown, sets: 3, effort: 15 }
    - { exercise: band-pull-apart, sets: 3, effort: 15 }
    - { exercise: band-lateral-raise, sets: 3, effort: 15 }
    - { exercise: band-curl, sets: 3, effort: 15 }
    - { exercise: band-triceps-pushdown, sets: 3, effort: 15 }
- slug: home-kettlebell-a
  translations:
    en:
      name: 'Kettlebell A'
      description: 'The slow kettlebell lifts: deadlift, squat, row and press. Learn these before you swing.'
    ru:
      name: 'Гиревая тренировка А'
      description: 'Медленные упражнения с гирей: становая тяга, приседания, тяга и жим. Освойте их, прежде чем переходить к махам.'
  activities:
    - { exercise: kettlebell-deadlift, sets: 3, effort: 10 }
    - { exercise: kettlebell-goblet-squat, sets: 3, effort: 10 }
    - { exercise: kettlebell-row, sets: 3, effort: 10 }
    - { exercise: kettlebell-overhead-press, sets: 3, effort: 8 }
    - { exercise: plank, sets: 3, effort: 45 }
- slug: home-kettlebell-b
  translations:
    en:
      name: 'Kettlebell B'
      description: 'The fast kettlebell lifts: the swing and the clean and press, with the Turkish get-up to finish.'
    ru:
      name: 'Гиревая тренировка Б'
      description: 'Быстрые упражнения с гирей: махи, взятие и жим, а в завершение турецкий подъём.'
  activities:
    - { exercise: kettlebell-swing, sets: 5, effort: 15 }
    - { exercise: kettlebell-clean-and-press, sets: 3, effort: 6 }
    - { exercise: kettlebell-goblet-squat, sets: 3, effort: 12 }
    - { exercise: kettlebell-turkish-get-up, sets: 3, effort: 3 }
