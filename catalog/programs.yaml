- slug: gym-beginner-full-body
  translations:
    en:
      name: 'Gym Beginner Full Body'
      description: 'Three identical full-body sessions a week with a rest day between them. A good first program if you are new to the gym.'
    ru:
      name: 'Тренажёрный зал: всё тело для начинающих'
      description: 'Три одинаковые тренировки на всё тело в неделю с днём отдыха между ними. Подходит как первая программа для новичков в тренажёрном зале.'
  schedule:
    - { weekday: monday, template: gym-full-body-beginner }
    - { weekday: wednesday, template: gym-full-body-beginner }
    - { weekday: friday, template: gym-full-body-beginner }
  previous_names: [Beginner]
- slug: gym-3-day-split
  translations:
    en:
      name: '3 Day Split'
      description: 'Three sessions a week, each for a different part of the body: chest, shoulders and triceps; back and biceps; legs and core.'
    ru:
      name: '3-дневный сплит'
      description: 'Три тренировки в неделю, каждая на свою часть тела: грудь, плечи и трицепс; спина и бицепс; ноги и кор.'
  schedule:
    - { weekday: monday, template: gym-chest-shoulders-triceps }
    - { weekday: wednesday, template: gym-back-biceps }
    - { weekday: friday, template: gym-legs-core }
- slug: cycling-beginner-week-1
  translations:
    en:
      name: 'Cycling — Beginner (Week 1)'
      description: 'A seven-day beginner cycling week built around heart-rate zones.'
    ru:
      name: 'Велотренировки — Начальный уровень (1 неделя)'
      description: 'Недельная программа для начинающих велосипедистов на основе зон пульса.'
  schedule:
    - { weekday: monday, template: cycling-recovery-spin }
    - { weekday: tuesday, template: cycling-endurance-fast-pedal-short }
    - { weekday: wednesday, template: cycling-steady-endurance }
    - { weekday: thursday, template: cycling-endurance-fast-pedal-short }
    - { weekday: saturday, template: cycling-endurance-fast-pedal-long }
    - { weekday: sunday, template: cycling-hill-endurance }
  # Production carries the name with a plain hyphen (or en dash) instead of the em dash.
  previous_names: ['Cycling - Beginner (Week 1)', 'Cycling – Beginner (Week 1)']
- slug: gym-machines-beginner
  translations:
    en:
      name: 'Gym Machines Beginner'
      description: 'Three sessions a week on machines only, alternating two sessions. A gentle way into the gym before you move on to free weights.'
    ru:
      name: 'Тренажёрный зал: тренажёры для начинающих'
      description: 'Три тренировки в неделю только в тренажёрах, две тренировки чередуются. Мягкое начало занятий в зале перед переходом к свободным весам.'
  schedule:
    - { weekday: monday, template: gym-machine-full-body-a }
    - { weekday: wednesday, template: gym-machine-full-body-b }
    - { weekday: friday, template: gym-machine-full-body-a }
- slug: gym-upper-lower
  translations:
    en:
      name: 'Gym Upper / Lower'
      description: 'Four sessions a week: two for the upper body and two for the lower, one heavy and one lighter of each. For people with a few months of training behind them.'
    ru:
      name: 'Тренажёрный зал: верх и низ'
      description: 'Четыре тренировки в неделю: две на верх тела и две на низ, в каждой паре одна тяжёлая и одна более лёгкая. Для тех, у кого за плечами несколько месяцев занятий.'
  schedule:
    - { weekday: monday, template: gym-upper-a }
    - { weekday: tuesday, template: gym-lower-a }
    - { weekday: thursday, template: gym-upper-b }
    - { weekday: friday, template: gym-lower-b }
- slug: gym-push-pull-legs
  translations:
    en:
      name: 'Gym Push / Pull / Legs'
      description: 'Three sessions a week, split by movement: pushing, pulling and legs. Each muscle is trained once a week.'
    ru:
      name: 'Тренажёрный зал: жимы, тяги, ноги'
      description: 'Три тренировки в неделю, разделённые по типу движения: жимы, тяги и ноги. Каждая мышца тренируется раз в неделю.'
  schedule:
    - { weekday: monday, template: gym-push-a }
    - { weekday: wednesday, template: gym-pull-a }
    - { weekday: friday, template: gym-legs-a }
- slug: gym-push-pull-legs-6-day
  translations:
    en:
      name: 'Gym Push / Pull / Legs 6 Day'
      description: 'Six sessions a week with one rest day: pushing, pulling and legs, each done twice with different exercises. For experienced lifters who recover well.'
    ru:
      name: 'Тренажёрный зал: жимы, тяги, ноги, 6 дней'
      description: 'Шесть тренировок в неделю с одним днём отдыха: жимы, тяги и ноги, каждая тренировка дважды с разными упражнениями. Для опытных атлетов с хорошим восстановлением.'
  schedule:
    - { weekday: monday, template: gym-push-a }
    - { weekday: tuesday, template: gym-pull-a }
    - { weekday: wednesday, template: gym-legs-a }
    - { weekday: thursday, template: gym-push-b }
    - { weekday: friday, template: gym-pull-b }
    - { weekday: saturday, template: gym-legs-b }
- slug: gym-strength-5x5
  translations:
    en:
      name: 'Gym Strength 5x5'
      description: 'Three short barbell sessions a week built on five sets of five. Session A is done on Monday and Friday, session B on Wednesday.'
    ru:
      name: 'Тренажёрный зал: сила 5×5'
      description: 'Три короткие тренировки со штангой в неделю по схеме пять подходов из пяти повторений. Тренировка А выполняется в понедельник и пятницу, тренировка Б в среду.'
  schedule:
    - { weekday: monday, template: gym-strength-a }
    - { weekday: wednesday, template: gym-strength-b }
    - { weekday: friday, template: gym-strength-a }
- slug: home-bodyweight-beginner
  translations:
    en:
      name: 'Bodyweight Beginner'
      description: 'Three sessions a week at home with no equipment at all. A good start if you have not trained before.'
    ru:
      name: 'Собственный вес: для начинающих'
      description: 'Три тренировки в неделю дома без какого-либо оборудования. Подходит тем, кто раньше не тренировался.'
  schedule:
    - { weekday: monday, template: home-bodyweight-full-body-a }
    - { weekday: wednesday, template: home-bodyweight-full-body-b }
    - { weekday: friday, template: home-bodyweight-full-body-a }
- slug: home-bodyweight-intermediate
  translations:
    en:
      name: 'Bodyweight Intermediate'
      description: 'Four sessions a week: two for the upper body, one for the lower body and one for conditioning. You need a pull-up bar.'
    ru:
      name: 'Собственный вес: средний уровень'
      description: 'Четыре тренировки в неделю: две на верх тела, одна на низ и одна на выносливость. Понадобится турник.'
  schedule:
    - { weekday: monday, template: home-bodyweight-upper }
    - { weekday: tuesday, template: home-bodyweight-lower }
    - { weekday: thursday, template: home-bodyweight-upper }
    - { weekday: saturday, template: home-bodyweight-conditioning }
- slug: home-dumbbell-full-body
  translations:
    en:
      name: 'Dumbbell Full Body'
      description: 'Three whole-body sessions a week with one pair of dumbbells, alternating two sessions.'
    ru:
      name: 'Гантели: всё тело'
      description: 'Три тренировки на всё тело в неделю с одной парой гантелей, две тренировки чередуются.'
  schedule:
    - { weekday: monday, template: home-dumbbell-full-body-a }
