- slug: home-dumbbell-upper-lower
  translations:
    en:
      name: 'Dumbbell Upper / Lower'
      description: 'Four sessions a week with one pair of dumbbells: upper body and lower body, each done twice.'
    ru:
      name: 'Гантели: верх и низ'
      description: 'Четыре тренировки в неделю с одной парой гантелей: верх тела и низ тела, каждая тренировка дважды.'
  schedule:
    - { weekday: monday, template: home-dumbbell-upper }
