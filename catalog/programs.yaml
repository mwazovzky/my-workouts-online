    - { weekday: friday, template: home-dumbbell-lower }
- slug: home-band-full-body
  translations:
    en:
      name: 'Resistance Band Full Body'
      description: 'Three whole-body sessions a week with a resistance band. Easy on the joints and easy to take with you when you travel.'
    ru:
      name: 'Эспандер: всё тело'
      description: 'Три тренировки на всё тело в неделю с эспандером. Щадит суставы, а эспандер легко взять с собой в поездку.'
  schedule:
