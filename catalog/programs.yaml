- slug: home-kettlebell-basics
  translations:
    en:
      name: 'Kettlebell Basics'
      description: 'Three sessions a week with a single kettlebell, alternating the slow lifts with the fast ones.'
    ru:
      name: 'Гиря: основы'
      description: 'Три тренировки в неделю с одной гирей: медленные упражнения чередуются с быстрыми.'
  schedule:
