# Schemathesis configuration for scripts/contract-test.sh.
#
# The coverage phase probes every path with unexpected HTTP methods. Limit it
# to standard methods: behind nginx the API answers unknown methods with 405,
# but PHP's built-in server (used in CI) answers non-standard ones such as
# QUERY with a bare 500, which is not a property of the contract.
[phases.coverage]
unexpected-methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]

# A missing required header is rejected with one of these statuses. The
# default list lacks 428 Precondition Required (RFC 6585), the contract's
# answer to a PUT /workouts/{workoutId}/activities without If-Match, which
# both backends give once the workout is the caller's and in progress.
[checks.missing_required_header]
expected-statuses = ["400", "401", "403", "406", "415", "422", "428"]
