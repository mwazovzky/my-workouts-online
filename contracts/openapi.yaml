openapi: 3.1.0
info:
  title: My Workouts API
  version: 1.0.0
  description: |
    Contract for the `/api/v1` surface consumed by the web SPA and the iOS app,
    and implemented by the backend. The design rules behind it are written in
    `docs/api-design.md` and enforced by `contracts/.spectral.yaml`.

    Conventions:
    - Authentication: `Authorization: Bearer <access JWT>` on every protected
      route. Access tokens are short-lived asymmetric JWTs verifiable against
      `/.well-known/jwks.json`. Refresh tokens are opaque and rotate on every use.
    - Localization: clients send `Accept-Language`. The server negotiates against
      the supported locales, translates database content per field with an
      English fallback, and answers with `Content-Language` and
      `Vary: Accept-Language`.
    - Request bodies are strict: every object declares `additionalProperties:
      false` and an undeclared key is rejected with 422 (`invalid`).
    - Errors: every non-2xx response is an RFC 9457 `Problem`
      (`application/problem+json`) whose `code` is an `ErrorCode`; validation
      failures are a `ValidationProblem` with one `{pointer, code, detail}`
      entry per rejected field, `code` being a `FieldErrorCode`.
    - Every response carries `X-Request-Id`, the id that also appears in
      `Problem.instance` and in the server logs.
    - Pagination: list endpoints that paginate return `{ data, links, meta }`
      (`PageLinks`, `PageMeta`) and accept `page` and `per_page`.
    - Status: endpoints marked `x-status: target` are not implemented yet.
  contact:
    name: My Workouts
    url: https://github.com/mwazovzky/my-workouts-online

servers:
  - url: /
    description: Same origin as the SPA; nginx routes `/api/*` to the API upstream.

tags:
  - name: Auth
    description: Registration, login, token refresh, password reset, email verification, step-up.
  - name: Me
    description: The authenticated user's own profile and preferences.
  - name: Meta
    description: Public application options such as supported locales.
  - name: Dashboard
    description: Authenticated home data.
  - name: Programs
    description: Program catalog and enrollment.
  - name: Workout Templates
    description: Read-only template detail for the program flow.
  - name: Exercises
    description: Exercise catalog for pickers.
  - name: Workouts
    description: The caller's own workouts and set logging.
  - name: Admin
    description: Catalog management, admin role required.
  - name: Health
    description: Liveness and readiness probes used by nginx, CI and the deploy script.

security:
  - bearerAuth: []

paths:
  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: Public signing keys for access-token verification
      operationId: getJwks
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    alg: EdDSA
                    use: sig
                    kid: 1f2e3d4c5b6a7980
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The process answers requests
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  timestamp: { type: string, format: date-time, example: '2026-10-07T09:30:00Z' }
              example: { status: ok, timestamp: '2026-10-07T09:30:00Z' }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: "200 when every component is up, 503 with `status: degraded` otherwise."
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Every component is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: { status: ok, components: { database: up, jwt: up }, timestamp: '2026-10-07T09:30:00Z' }
        '503':
          description: At least one component is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: { status: degraded, components: { database: down, jwt: up }, timestamp: '2026-10-07T09:30:00Z' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register and receive a token pair
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered. Web clients receive the refresh token as a cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. Web clients receive the refresh token as a cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: The email and password do not match an account
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://my-workouts.online/problems/invalid_credentials, title: Invalid credentials, status: 401, detail: These credentials do not match our records., instance: '/api/v1/auth/login#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: invalid_credentials }
        '422':
          description: Malformed input only; a wrong password is a 401
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '429':
          description: Locked out after five failed attempts for this email and IP within a minute
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema: { type: integer }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://my-workouts.online/problems/too_many_attempts, title: Too many attempts, status: 429, detail: Too many login attempts. Please try again in 42 seconds., instance: '/api/v1/auth/login#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: too_many_attempts }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and issue a new access token
      description: |
        Web clients send the refresh token via the httpOnly cookie and must include
        the `X-Requested-With` header. Native clients send it in the body.
        Reusing a refresh token that was already rotated revokes its whole family.
      operationId: refresh
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
                  description: Native clients only.
      responses:
        '200':
          description: New token pair
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Cookie flow without the `X-Requested-With` header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { type: https://my-workouts.online/problems/forbidden, title: Forbidden, status: 403, detail: Missing X-Requested-With header., instance: '/api/v1/auth/refresh#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: forbidden }
        '401':
          description: Refresh token missing, expired, revoked, or reused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missing:
                  value: { type: https://my-workouts.online/problems/refresh_token_missing, title: Refresh token missing, status: 401, detail: Refresh token missing., instance: '/api/v1/auth/refresh#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: refresh_token_missing }
                invalid:
                  value: { type: https://my-workouts.online/problems/refresh_token_invalid, title: Refresh token invalid, status: 401, detail: Refresh token invalid., instance: '/api/v1/auth/refresh#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: refresh_token_invalid }
                reused:
                  value: { type: https://my-workouts.online/problems/refresh_token_reused, title: Refresh token reuse detected, status: 401, detail: Refresh token reuse detected., instance: '/api/v1/auth/refresh#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: refresh_token_reused }
                expired:
                  value: { type: https://my-workouts.online/problems/refresh_token_expired, title: Refresh token expired, status: 401, detail: Refresh token expired., instance: '/api/v1/auth/refresh#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: refresh_token_expired }
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh-token family
      operationId: logout
      responses:
        '204':
          description: Logged out; the refresh cookie is cleared for web clients.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/reauth:
    post:
      tags: [Auth]
      summary: Step-up re-authentication for sensitive actions
      description: Returns a fresh access token with an updated `auth_time` claim.
      operationId: reauth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Fresh access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, description: Seconds until expiry }
              example: { access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjFmMmUzZDRjNWI2YTc5ODAifQ.e30.sig, expires_in: 900 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'


  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Send a password reset link to the SPA
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted regardless of whether the email exists.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset the password with a single-use token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '204':
          description: Password reset; all refresh-token families are revoked.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'


  /api/v1/auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify the email address using the link parameters
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, hash, expires, signature]
              properties:
                id: { type: integer }
                hash: { type: string }
                expires: { type: integer }
                signature: { type: string }
      responses:
        '204':
          description: Verified (or already verified).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Link belongs to another account, or signature invalid or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                wrongAccount:
                  value: { type: https://my-workouts.online/problems/invalid_verification_link, title: Invalid verification link, status: 403, detail: This verification link does not belong to the signed-in account., instance: '/api/v1/auth/email/verify#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: invalid_verification_link }
                badSignature:
                  value: { type: https://my-workouts.online/problems/invalid_signature, title: Invalid signature, status: 403, detail: This verification link is invalid or has expired., instance: '/api/v1/auth/email/verify#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: invalid_signature }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'


  /api/v1/auth/email/resend:
    post:
      tags: [Auth]
      summary: Resend the verification email
      operationId: resendVerification
      responses:
        '202':
          description: Accepted; a verification email is sent unless the address is already verified.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/social/{provider}:
    post:
      tags: [Auth]
      summary: Sign in with an external identity (token exchange)
      description: |
        Reserved for Google and Apple login. Web clients post the authorization
        `code` obtained via PKCE; native clients post the provider `id_token`.
        The API verifies the provider token and issues its own token pair.
      operationId: socialLogin
      x-status: target
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, apple]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client]
              properties:
                client: { $ref: '#/components/schemas/ClientKind' }
                code: { type: string }
                id_token: { type: string }
                nonce: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me:
    get:
      tags: [Me]
      summary: Current user
      operationId: getMe
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Me]
      summary: Update the current user (merge patch)
      description: |
        RFC 7386 JSON Merge Patch: send only the fields to change; absent fields
        are untouched. At least one field is required. A changed `email`
        un-verifies the account until the new address is verified.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatch'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Me]
      summary: Delete the account
      description: Requires the current password; revokes every refresh-token family.
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/meta:
    get:
      tags: [Meta]
      summary: Public application options
      operationId: getMeta
      security: []
      responses:
        '200':
          description: Locales and theme options
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [available_locales, theme_preferences]
                    properties:
                      available_locales:
                        type: object
                        additionalProperties: { type: string }
                        example: { en: English, ru: Русский }
                      theme_preferences:
                        type: array
                        items: { $ref: '#/components/schemas/ThemePreference' }
              example:
                data:
                  available_locales: { en: English, ru: Русский }
                  theme_preferences: [light, dark, system]

  /api/v1/me/password:
    put:
      tags: [Me]
      summary: Change the password
      description: Revokes every other refresh-token family; the current session stays signed in.
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, password]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password }
      responses:
        '204':
          description: Changed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Authenticated home data
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/programs:
    get:
      tags: [Programs]
      summary: List programs with the caller's enrollment state
      operationId: listPrograms
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Programs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Program' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/programs/{programId}:
    get:
      tags: [Programs]
      summary: Program with its weekday-assigned templates
      operationId: getProgram
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProgramDetail' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/programs/{programId}/enroll:
    post:
      tags: [Programs]
      summary: Enroll the caller in a program (idempotent)
      operationId: enrollProgram
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '204':
          description: Enrolled
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workout-templates/{workoutTemplateId}:
    get:
      tags: [Workout Templates]
      summary: Workout template with activities and sets
      operationId: getWorkoutTemplate
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/WorkoutTemplateId'
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutTemplate' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/exercises:
    get:
      tags: [Exercises]
      summary: Exercise catalog for pickers (retired exercises excluded)
      operationId: listExercises
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Exercises sorted by localized name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/workouts:
    get:
      tags: [Workouts]
      summary: Caller's workout history, newest updated first
      operationId: listWorkouts
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: page
          in: query
          description: 1-based page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: Items per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated workouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Workouts]
      summary: Start a workout from a template
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workout_template_id]
              properties:
                workout_template_id: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/workouts/{workoutId}:
    get:
      tags: [Workouts]
      summary: Workout with activities and sets (owner only)
      operationId: getWorkout
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workouts]
      summary: Delete a workout (owner only)
      description: A workout the caller does not own answers 404, never 403.
      operationId: deleteWorkout
      parameters:
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workouts/{workoutId}/activities:
    put:
      tags: [Workouts]
      summary: Replace the activities and sets of an in-progress workout
      description: |
        Full replacement: activities and sets missing from the body are deleted, entries with an `id`
        are updated, entries without one are created. `If-Match` must carry the `ETag` of the workout
        the editor loaded; a workout changed since answers 412 and is left untouched.
        A workout the caller does not own answers 404; the caller's own completed workout answers 403.
      operationId: replaceWorkoutActivities
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/WorkoutId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutActivitiesWrite'
      responses:
        '200':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/v1/workouts/{workoutId}/complete:
