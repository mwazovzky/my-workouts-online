components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token claims: `iss`, `aud`, `sub` (user id), `iat`, `exp`, `jti`,
        `auth_time` (seconds since epoch of the last password proof).

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred locale for translated content. Unsupported values fall back to `en`.
      schema: { type: string, example: ru }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-carried refresh tokens.
      schema: { type: string, enum: [XMLHttpRequest] }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` of the workout as last read (RFC 9110 strong comparison); `*` skips the check.
      schema: { type: string, example: '"42-7"' }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: integer }
    WorkoutId:
      name: workoutId
      in: path
      required: true
      schema: { type: integer }
    WorkoutTemplateId:
      name: workoutTemplateId
      in: path
      required: true
      schema: { type: integer }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: integer }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: integer }
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: { type: integer }

  headers:
    ETag:
      description: Version of the workout, `"<id>-<version>"`; changes whenever the workout or its activities change. Send it back as `If-Match` when replacing the activities.
      required: true
      schema: { type: string, example: '"42-7"' }
    RefreshCookie:
      description: |
        Web clients only. `refresh_token=<opaque>; HttpOnly; Secure; SameSite=Strict;
        Path=/api/v1/auth/refresh; Max-Age=<seconds>`
      schema: { type: string }
    ContentLanguage:
      description: Locale used for translated content in this response.
      schema: { type: string }
    RequestId:
      description: Correlation id of this request, sent on every response; the incoming `X-Request-Id` when it is a UUID, otherwise generated. Appears in `Problem.instance` and in the server logs.
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Missing, invalid, or expired access token
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            missing:
              value: { type: https://my-workouts.online/problems/unauthenticated, title: Unauthenticated, status: 401, detail: Unauthenticated., instance: '/api/v1/me#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: unauthenticated }
            expired:
              value: { type: https://my-workouts.online/problems/token_expired, title: Access token expired, status: 401, detail: Unauthenticated., instance: '/api/v1/me#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: token_expired }
    Forbidden:
      description: Authenticated but not allowed
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unverified:
              value: { type: https://my-workouts.online/problems/email_unverified, title: Email address not verified, status: 403, detail: Your email address is not verified., instance: '/api/v1/dashboard#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: email_unverified }
            forbidden:
              value: { type: https://my-workouts.online/problems/forbidden, title: Forbidden, status: 403, detail: This action is unauthorized., instance: '/api/v1/admin/equipment#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: forbidden }
    NotFound:
      description: Record not found, or not owned by the caller (ownership never answers 403)
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://my-workouts.online/problems/not_found, title: Not found, status: 404, detail: Record not found., instance: '/api/v1/workouts/42#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: not_found }
    PreconditionFailed:
      description: The `If-Match` tag no longer matches; the workout changed since it was read
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://my-workouts.online/problems/precondition_failed, title: Precondition failed, status: 412, detail: This workout was changed elsewhere. Reload it to continue., instance: '/api/v1/workouts/42/activities#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: precondition_failed }
    PreconditionRequired:
      description: The request has no `If-Match` header
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://my-workouts.online/problems/precondition_required, title: Precondition required, status: 428, detail: Send the workout's ETag in If-Match., instance: '/api/v1/workouts/42/activities#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: precondition_required }
    Conflict:
      description: Operation refused because of existing references
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://my-workouts.online/problems/in_use, title: Resource in use, status: 409, detail: Cannot delete equipment that is used by exercises., instance: '/api/v1/admin/equipment/2#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: in_use }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://my-workouts.online/problems/too_many_requests, title: Too many requests, status: 429, detail: Too Many Attempts., instance: '/api/v1/auth/email/resend#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f', code: too_many_requests }
    ValidationError:
      description: Validation failed
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    UserResponse:
      description: User
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/User' }
    WorkoutResponse:
      description: Workout
      headers:
        Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Workout' }
    EquipmentResponse:
      description: Equipment
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Equipment' }
    AdminCategoryResponse:
      description: Category (admin view)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminCategory' }
    AdminExerciseResponse:
      description: Exercise (admin view)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminExercise' }
    AdminWorkoutTemplateResponse:
      description: Workout template (admin view)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminWorkoutTemplate' }
    AdminProgramResponse:
      description: Program (admin view)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminProgram' }

  schemas:
    # ------------------------------------------------------------- Errors
    ErrorCode:
      type: string
      description: Every top-level problem code the API emits. Clients switch on `code`, never on `title` or `detail`.
      enum:
        - bad_request
        - unauthenticated
        - invalid_credentials
        - token_expired
        - refresh_token_missing
        - refresh_token_invalid
        - refresh_token_expired
        - refresh_token_reused
        - forbidden
        - email_unverified
        - not_found
        - method_not_allowed
        - conflict
        - in_use
        - precondition_failed
        - precondition_required
        - validation_failed
        - too_many_requests
        - too_many_attempts
        - invalid_verification_link
        - invalid_signature
        - internal_error
    FieldErrorCode:
      type: string
      description: Why one request field was rejected.
      enum:
        - required
        - invalid_format
        - invalid_value
        - too_short
        - too_long
        - out_of_range
        - not_unique
        - not_found
        - mismatch
        - unknown_field
    Problem:
      type: object
      description: RFC 9457 Problem Details; every non-2xx response under `/api/*`, served as `application/problem+json`.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: '`{APP_URL}/problems/{code}`; an identifier, not a page.'
        title:
          type: string
          description: Stable English summary of `code`; never localized.
        status:
          type: integer
          format: int32
          description: The HTTP status code of the response.
        detail:
          type: string
          description: Localized, human-readable explanation of this occurrence.
        instance:
          type: string
          description: 'Request path plus the request id: `/api/v1/workouts/42#<uuid>`. The same id is returned in `X-Request-Id`.'
        code:
          $ref: '#/components/schemas/ErrorCode'
      example:
        type: https://my-workouts.online/problems/not_found
        title: Not found
        status: 404
        detail: Record not found.
        instance: /api/v1/workouts/42#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f
        code: not_found
    ValidationProblem:
      type: object
      description: "A `Problem` whose code is `validation_failed`, with one entry per rejected field. Written flat (not `allOf`) so generated clients get one type."
      required: [type, title, status, detail, code, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum: [validation_failed]
        errors:
          type: array
          items:
            type: object
            required: [pointer, code, detail]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer into the request body, e.g. `/activities/0/sets/1/effort_value`.
              code:
                $ref: '#/components/schemas/FieldErrorCode'
              detail:
                type: string
                description: Localized.
      example:
        type: https://my-workouts.online/problems/validation_failed
        title: Validation failed
        status: 422
        detail: The effort value must be an integer. (and 1 more error)
        instance: /api/v1/workouts/42/activities#9b2d1f0e-7c3a-4c6e-9d2b-1a2b3c4d5e6f
        code: validation_failed
        errors:
          - { pointer: /activities/0/sets/1/effort_value, code: invalid_format, detail: The effort value must be an integer. }
          - { pointer: /activities/1/exercise_id, code: not_found, detail: The selected exercise could not be found. }

    # ------------------------------------------------------------- Common
    Readiness:
      type: object
      required: [status, components, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        components:
          type: object
          description: One entry per checked dependency.
          additionalProperties: { type: string, enum: [up, down] }
        timestamp: { type: string, format: date-time, example: '2026-10-07T09:30:00Z' }
    PageLinks:
      type: object
      required: [first, last, prev, next]
      additionalProperties: false
      properties:
        first: { type: [string, 'null'], format: uri }
        last: { type: [string, 'null'], format: uri }
        prev: { type: [string, 'null'], format: uri }
        next: { type: [string, 'null'], format: uri }
    PageMeta:
      type: object
      required: [current_page, from, last_page, per_page, to, total]
      additionalProperties: false
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'], description: 1-based index of the first item on this page; null when the page is empty. }
        last_page: { type: integer }
        per_page: { type: integer }
        to: { type: [integer, 'null'], description: 1-based index of the last item on this page; null when the page is empty. }
        total: { type: integer }
    WorkoutPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Workout' }
        links: { $ref: '#/components/schemas/PageLinks' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      example:
        data:
          - id: 42
            user_id: 7
            name: Push A
            status: completed
            created_at: '2026-10-05T18:06:30Z'
            updated_at: '2026-10-05T19:02:11Z'
            activities_count: 6
            activities: []
        links:
          first: https://my-workouts.example/api/v1/workouts?page=1&per_page=20
          last: https://my-workouts.example/api/v1/workouts?page=3&per_page=20
          prev: null
          next: https://my-workouts.example/api/v1/workouts?page=2&per_page=20
        meta: { current_page: 1, from: 1, last_page: 3, per_page: 20, to: 20, total: 47 }
    Locale:
      type: string
      enum: [en, ru]
    ThemePreference:
      type: string
      enum: [light, dark, system]
    ClientKind:
      type: string
      enum: [web, native]
      description: Decides whether the refresh token is delivered as a cookie (web) or in the body (native).
    Weekday:
      type: string
      description: Lowercase English day names. Clients render their own localized label.
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    EffortType:
      type: string
      enum: [repetitions, duration]
    DifficultyUnit:
      type: string
      enum: [kilograms, pounds, plates, heart_rate_zone, none]
    WorkoutStatus:
      type: string
      enum: [in_progress, completed]
    TranslationMap:
      type: object
      description: Raw per-locale values with no fallback; `null` means no translation stored.
      additionalProperties: { type: [string, 'null'] }
      example: { en: Chest, ru: Грудь }
    NameTranslationsWrite:
      type: object
      description: Per-locale name for resources without a description. Blank values remove that locale's translation so reads fall back to English.
      required: [en]
      additionalProperties: false
      properties:
        en:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 255 }
        ru:
          type: object
          additionalProperties: false
          properties:
            name: { type: [string, 'null'], maxLength: 255 }
    TranslationsWrite:
      type: object
      description: Blank values remove that locale's translation so reads fall back to English.
      required: [en]
      additionalProperties: false
      properties:
        en:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 255 }
            description: { type: [string, 'null'], maxLength: 2000 }
        ru:
          type: object
          additionalProperties: false
          properties:
            name: { type: [string, 'null'], maxLength: 255 }
            description: { type: [string, 'null'], maxLength: 2000 }

    # ------------------------------------------------------------- Auth
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, client]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password }
        client: { $ref: '#/components/schemas/ClientKind' }
        device_name: { type: string, maxLength: 255 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, client]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        client: { $ref: '#/components/schemas/ClientKind' }
        device_name: { type: string, maxLength: 255 }
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        refresh_token:
          type: string
          description: Present for native clients only. Web clients receive it as a cookie.
        user: { $ref: '#/components/schemas/User' }
      example:
        access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjFmMmUzZDRjNWI2YTc5ODAifQ.e30.sig
        token_type: Bearer
        expires_in: 900
        user: { id: 7, name: Ada, email: ada@example.com, locale: en, theme_preference: system, is_admin: false, email_verified_at: '2026-10-01T09:30:00Z' }

    # ------------------------------------------------------------- Users
    MePatch:
      type: object
      description: RFC 7386 merge patch for the current user; every field optional, at least one present.
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        locale: { $ref: '#/components/schemas/Locale' }
        theme_preference: { $ref: '#/components/schemas/ThemePreference' }
    User:
      type: object
      required: [id, name, email, locale, theme_preference, is_admin, email_verified_at]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        email: { type: string, format: email }
        locale: { $ref: '#/components/schemas/Locale' }
        theme_preference: { $ref: '#/components/schemas/ThemePreference' }
        is_admin: { type: boolean }
        email_verified_at:
          type: [string, 'null']
          format: date-time
          description: When the email address was verified; null until it is.
          example: '2026-10-01T09:30:00Z'
      example: { id: 7, name: Ada, email: ada@example.com, locale: en, theme_preference: system, is_admin: false, email_verified_at: '2026-10-01T09:30:00Z' }

    # ------------------------------------------------------------- Catalog
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
      example: { id: 3, name: Chest }
    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [translations]
          properties:
            exercises_count: { type: integer }
            translations:
              type: object
              properties:
                name: { $ref: '#/components/schemas/TranslationMap' }
      example: { id: 3, name: Chest, exercises_count: 12, translations: { name: { en: Chest, ru: Грудь } } }
    CategoryWrite:
      type: object
      additionalProperties: false
      required: [translations]
      properties:
        translations: { $ref: '#/components/schemas/NameTranslationsWrite' }
    Equipment:
      type: object
      required: [id, name, difficulty_unit]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        exercises_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
      example: { id: 2, name: Barbell, difficulty_unit: kilograms, exercises_count: 9, translations: { name: { en: Barbell, ru: Штанга } } }
    EquipmentWrite:
      type: object
      additionalProperties: false
      required: [difficulty_unit, translations]
      properties:
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        translations: { $ref: '#/components/schemas/NameTranslationsWrite' }
    Exercise:
      type: object
      required: [id, name, equipment_id, effort_type, rest_time_seconds]
      example:
        id: 15
        name: Bench press
        description: Lie on the bench, lower the bar to the chest, press up.
        equipment_id: 2
        equipment_name: Barbell
        effort_type: repetitions
        difficulty_unit: kilograms
        rest_time_seconds: 120
        category_ids: [3]
        categories: [{ id: 3, name: Chest }]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        description: { type: [string, 'null'], description: Localized. }
        equipment_id: { type: integer }
        equipment_name: { type: [string, 'null'] }
        effort_type: { $ref: '#/components/schemas/EffortType' }
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        rest_time_seconds: { type: [integer, 'null'] }
        category_ids:
          type: array
          items: { type: integer }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    AdminExercise:
      allOf:
        - $ref: '#/components/schemas/Exercise'
        - type: object
          required: [translations]
          properties:
            translations:
              type: object
              properties:
                name: { $ref: '#/components/schemas/TranslationMap' }
                description: { $ref: '#/components/schemas/TranslationMap' }
      example:
        id: 15
        name: Bench press
        description: Lie on the bench, lower the bar to the chest, press up.
        equipment_id: 2
        equipment_name: Barbell
        effort_type: repetitions
        difficulty_unit: kilograms
        rest_time_seconds: 120
        category_ids: [3]
        categories: [{ id: 3, name: Chest }]
        translations:
          name: { en: Bench press, ru: Жим лёжа }
          description: { en: 'Lie on the bench, lower the bar to the chest, press up.', ru: null }
    ExerciseWrite:
      type: object
      additionalProperties: false
      required: [equipment_id, effort_type, translations]
      properties:
        equipment_id: { type: integer }
        effort_type: { $ref: '#/components/schemas/EffortType' }
        rest_time_seconds: { type: [integer, 'null'], minimum: 0, maximum: 3600 }
        category_ids:
          type: array
          items: { type: integer }
        translations: { $ref: '#/components/schemas/TranslationsWrite' }

    # ------------------------------------------------------------- Programs and templates
    Program:
      type: object
      required: [id, name, is_enrolled]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        description: { type: [string, 'null'], description: Localized. }
        is_enrolled: { type: boolean }
      example: { id: 1, name: Strength 5x5, description: Three full-body sessions a week., is_enrolled: true }
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/Program'
        - type: object
          required: [workout_templates]
          properties:
            workout_templates:
              type: array
              items: { $ref: '#/components/schemas/WorkoutTemplate' }
      example:
        id: 1
        name: Strength 5x5
        description: Three full-body sessions a week.
        is_enrolled: true
        workout_templates:
          - id: 22
            name: Strength 5x5 A
            description: Squat, bench press, barbell row.
            activities: []
            assignment: { weekday: monday }
    ProgramWrite:
      type: object
      additionalProperties: false
      required: [translations, assignments]
      properties:
        translations: { $ref: '#/components/schemas/TranslationsWrite' }
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [workout_template_id, weekday]
            properties:
              workout_template_id: { type: integer }
              weekday: { $ref: '#/components/schemas/Weekday' }
    AdminProgram:
      type: object
      required: [id, name, translations]
      example:
        id: 1
        name: Strength 5x5
        templates_count: 2
        translations:
          name: { en: Strength 5x5, ru: Сила 5x5 }
          description: { en: Three full-body sessions a week., ru: null }
        assignments:
          - { workout_template_id: 22, workout_template_name: Strength 5x5 A, weekday: monday }
          - { workout_template_id: 23, workout_template_name: Strength 5x5 B, weekday: wednesday }
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        templates_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
            description: { $ref: '#/components/schemas/TranslationMap' }
        assignments:
          type: array
          items:
            type: object
            required: [workout_template_id, workout_template_name, weekday]
            properties:
              workout_template_id: { type: integer }
              workout_template_name: { type: [string, 'null'] }
              weekday: { $ref: '#/components/schemas/Weekday' }
    WorkoutTemplate:
      type: object
      required: [id, name, activities]
      example:
        id: 22
        name: Strength 5x5 A
        description: Squat, bench press, barbell row.
        activities:
          - id: 301
            exercise_id: 15
            exercise:
              id: 15
              name: Bench press
              equipment_name: Barbell
              effort_type: repetitions
              difficulty_unit: kilograms
              category_names: [Chest]
              rest_time_seconds: 120
            sets:
              - { id: 901, order: 1, effort_value: 5, difficulty_value: null, is_completed: false }
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        description: { type: [string, 'null'], description: Localized. }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        assignment:
          type: object
          description: The weekday this template is scheduled on; present only when the template is listed inside a program.
          required: [weekday]
          properties:
            weekday: { $ref: '#/components/schemas/Weekday' }
    AdminWorkoutTemplate:
      type: object
      required: [id, name, translations]
      example:
        id: 22
        name: Strength 5x5 A
        activities_count: 3
        translations:
          name: { en: Strength 5x5 A, ru: Сила 5x5 A }
          description: { en: 'Squat, bench press, barbell row.', ru: null }
        activities:
          - id: 301
            exercise_id: 15
            exercise:
              id: 15
              name: Bench press
              equipment_name: Barbell
              effort_type: repetitions
              difficulty_unit: kilograms
              category_names: [Chest]
              rest_time_seconds: 120
            sets:
              - { id: 901, order: 1, effort_value: 5, difficulty_value: null, is_completed: false }
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        activities_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
            description: { $ref: '#/components/schemas/TranslationMap' }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
    WorkoutTemplateWrite:
      type: object
      additionalProperties: false
      required: [translations, activities]
      properties:
        translations: { $ref: '#/components/schemas/TranslationsWrite' }
        activities:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [exercise_id, order, sets]
            properties:
              exercise_id: { type: integer }
              order: { type: integer, minimum: 1, maximum: 1000 }
              sets:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/SetWrite' }

    # ------------------------------------------------------------- Workouts
    Set:
      type: object
      required: [id, order, effort_value, difficulty_value, is_completed]
      properties:
        id: { type: integer }
        order: { type: integer }
        effort_value: { type: integer, description: Reps or seconds depending on the exercise effort type. }
        difficulty_value:
          type: [number, 'null']
          description: Weight, plates, or heart-rate zone 1-5 depending on the equipment difficulty unit; null when the unit is `none`.
        is_completed: { type: boolean }
      example: { id: 901, order: 1, effort_value: 5, difficulty_value: 60, is_completed: true }
    SetWrite:
      type: object
      additionalProperties: false
      required: [order, effort_value]
      properties:
        id: { type: [integer, 'null'], description: Omit or null to create. }
        order: { type: integer, minimum: 1, maximum: 1000 }
        effort_value: { type: integer, minimum: 0, maximum: 100000 }
        difficulty_value: { type: [number, 'null'], minimum: 0, maximum: 10000 }
        is_completed: { type: boolean }
    Activity:
      type: object
      required: [id, exercise_id, sets]
      example:
        id: 501
        exercise_id: 15
        exercise:
          id: 15
          name: Bench press
          equipment_name: Barbell
          effort_type: repetitions
          difficulty_unit: kilograms
          category_names: [Chest]
          rest_time_seconds: 120
        sets:
          - { id: 901, order: 1, effort_value: 5, difficulty_value: 60, is_completed: true }
          - { id: 902, order: 2, effort_value: 5, difficulty_value: 60, is_completed: false }
      properties:
        id: { type: integer }
        exercise_id: { type: integer }
        exercise:
          description: Snapshot of the exercise for display. Absent when the exercise is not loaded (e.g. a template embedded in a freshly created workout); omitted rather than null because code generators drop nullable `$ref`s.
          $ref: '#/components/schemas/ActivityExercise'
        sets:
          type: array
          items: { $ref: '#/components/schemas/Set' }
    ActivityExercise:
      type: object
      required: [id, name, equipment_name, effort_type, difficulty_unit, category_names, rest_time_seconds]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized; retired exercises still resolve. }
        equipment_name: { type: [string, 'null'], description: Localized. }
        effort_type: { $ref: '#/components/schemas/EffortType' }
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        category_names:
          type: array
          description: Localized category names.
          items: { type: string }
        rest_time_seconds: { type: [integer, 'null'] }
      example: { id: 15, name: Bench press, equipment_name: Barbell, effort_type: repetitions, difficulty_unit: kilograms, category_names: [Chest], rest_time_seconds: 120 }
    Workout:
      type: object
      required: [id, user_id, name, status, created_at, updated_at, activities]
      example:
        id: 42
        user_id: 7
        name: Strength 5x5 A
        status: in_progress
        created_at: '2026-10-05T18:06:30Z'
        updated_at: '2026-10-05T19:02:11Z'
        activities_count: 1
        workout_template:
          id: 22
          name: Strength 5x5 A
          description: Squat, bench press, barbell row.
          activities: []
        activities:
          - id: 501
            exercise_id: 15
            exercise:
              id: 15
              name: Bench press
              equipment_name: Barbell
              effort_type: repetitions
              difficulty_unit: kilograms
              category_names: [Chest]
              rest_time_seconds: 120
            sets:
              - { id: 901, order: 1, effort_value: 5, difficulty_value: 60, is_completed: true }
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string, description: Copied from the template at creation; not re-translated. }
        status: { $ref: '#/components/schemas/WorkoutStatus' }
        created_at: { type: string, format: date-time, example: '2026-10-05T18:06:30Z' }
        updated_at: { type: string, format: date-time, example: '2026-10-05T19:02:11Z' }
        activities_count: { type: [integer, 'null'] }
        workout_template:
          description: Absent when the workout's template is not loaded or no longer exists. Omitted rather than null because code generators drop nullable `$ref`s.
          $ref: '#/components/schemas/WorkoutTemplate'
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
    WorkoutActivitiesWrite:
      type: object
      additionalProperties: false
      required: [activities]
      properties:
        activities:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [exercise_id, order, sets]
            properties:
              id: { type: [integer, 'null'], description: 'Existing activity id owned by this workout, or null to create.' }
              exercise_id: { type: integer }
              order: { type: integer, minimum: 1, maximum: 1000 }
              sets:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/SetWrite' }

    # ------------------------------------------------------------- Dashboard
    Dashboard:
      type: object
      required: [upcoming_schedule, recent_workouts, summary]
      example:
        upcoming_schedule:
          - id: 1-22-2026-10-12
            program_id: 1
            program_name: Strength 5x5
            workout_template_id: 22
            workout_name: Strength 5x5 A
            weekday: monday
            scheduled_at: '2026-10-12T00:00:00Z'
            scheduled_for: '2026-10-12'
        recent_workouts: []
        summary: { enrolled_programs_count: 1, completed_workouts_count: 12, completed_last_7_days_count: 3, upcoming_workouts_count: 3 }
      properties:
        upcoming_schedule:
          type: array
          items:
            type: object
            required: [id, program_id, program_name, workout_template_id, workout_name, weekday, scheduled_at, scheduled_for]
            properties:
              id: { type: string, description: '`{program_id}-{workout_template_id}-{date}`' }
              program_id: { type: integer }
              program_name: { type: [string, 'null'] }
              workout_template_id: { type: integer }
              workout_name: { type: [string, 'null'] }
              weekday: { $ref: '#/components/schemas/Weekday' }
