openapi: 3.1.0
info:
  title: My Workouts API
  version: 1.0.0
  description: |
    Contract for the `/api/v1` surface consumed by the web SPA, the iOS app,
    and implemented by any backend (PHP today, Go later).

    Conventions:
    - Authentication: `Authorization: Bearer <access JWT>` on every protected
      route. Access tokens are short-lived asymmetric JWTs verifiable against
      `/.well-known/jwks.json`. Refresh tokens are opaque and rotate on every use.
    - Localization: clients send `Accept-Language`. The server negotiates against
      the supported locales, translates database content per field with an
      English fallback, and answers with `Content-Language` and
      `Vary: Accept-Language`.
    - Errors: every non-2xx response uses the `Error` envelope. Validation
      failures use `ValidationError` with a stable `code` per field entry.
    - Pagination: list endpoints that paginate return `{ data, links, meta }`.
    - Status: endpoints marked `x-status: target` are not implemented yet.

servers:
  - url: /
    description: Same origin as the SPA; nginx routes `/api/*` to the API upstream.

tags:
  - name: Auth
    description: Registration, login, token refresh, password reset, email verification, step-up.
  - name: Me
    description: The authenticated user's own profile and preferences.
  - name: Meta
    description: Public application options such as supported locales.
  - name: Dashboard
    description: Authenticated home data.
  - name: Programs
    description: Program catalog and enrollment.
  - name: Workout Templates
    description: Read-only template detail for the program flow.
  - name: Exercises
    description: Exercise catalog for pickers.
  - name: Workouts
    description: The caller's own workouts and set logging.
  - name: Admin
    description: Catalog management, admin role required.

security:
  - bearerAuth: []

paths:
  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: Public signing keys for access-token verification
      operationId: getJwks
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register and receive a token pair
      operationId: register
      x-status: target
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered. Web clients receive the refresh token as a cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. Web clients receive the refresh token as a cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and issue a new access token
      description: |
        Web clients send the refresh token via the httpOnly cookie and must include
        the `X-Requested-With` header. Native clients send it in the body.
        Reusing a refresh token that was already rotated revokes its whole family.
      operationId: refresh
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Native clients only.
      responses:
        '200':
          description: New token pair
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Cookie flow without the `X-Requested-With` header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Refresh token missing, expired, revoked, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value: { message: 'Refresh token missing.', code: refresh_token_missing }
                invalid:
                  value: { message: 'Refresh token invalid.', code: refresh_token_invalid }
                reused:
                  value: { message: 'Refresh token reuse detected.', code: refresh_token_reused }
                expired:
                  value: { message: 'Refresh token expired.', code: refresh_token_expired }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh-token family
      operationId: logout
      responses:
        '204':
          description: Logged out; the refresh cookie is cleared for web clients.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/reauth:
    post:
      tags: [Auth]
      summary: Step-up re-authentication for sensitive actions
      description: Returns a fresh access token with an updated `auth_time` claim.
      operationId: reauth
      x-status: target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Fresh access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, description: Seconds until expiry }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Send a password reset link to the SPA
      operationId: forgotPassword
      x-status: target
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted regardless of whether the email exists.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset the password with a single-use token
      operationId: resetPassword
      x-status: target
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '204':
          description: Password reset; all refresh-token families are revoked.
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify the email address using the link parameters
      operationId: verifyEmail
      x-status: target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, hash, expires, signature]
              properties:
                id: { type: integer }
                hash: { type: string }
                expires: { type: integer }
                signature: { type: string }
      responses:
        '204':
          description: Verified (or already verified).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Signature invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/email/resend:
    post:
      tags: [Auth]
      summary: Resend the verification email
      operationId: resendVerification
      x-status: target
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/social/{provider}:
    post:
      tags: [Auth]
      summary: Sign in with an external identity (token exchange)
      description: |
        Reserved for Google and Apple login. Web clients post the authorization
        `code` obtained via PKCE; native clients post the provider `id_token`.
        The API verifies the provider token and issues its own token pair.
      operationId: socialLogin
      x-status: target
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, apple]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client]
              properties:
                client: { $ref: '#/components/schemas/ClientKind' }
                code: { type: string }
                id_token: { type: string }
                nonce: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me:
    get:
      tags: [Me]
      summary: Current user
      operationId: getMe
      x-status: target
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/meta:
    get:
      tags: [Meta]
      summary: Public application options
      operationId: getMeta
      x-status: target
      security: []
      responses:
        '200':
          description: Locales and theme options
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [available_locales, theme_preferences]
                    properties:
                      available_locales:
                        type: object
                        additionalProperties: { type: string }
                        example: { en: English, ru: Русский }
                      theme_preferences:
                        type: array
                        items: { $ref: '#/components/schemas/ThemePreference' }

  /api/v1/profile:
    patch:
      tags: [Me]
      summary: Update name and email
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Me]
      summary: Delete the account
      operationId: deleteProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/profile/password:
    put:
      tags: [Me]
      summary: Change password
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '204':
          description: Changed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/profile/locale:
    patch:
      tags: [Me]
      summary: Store the preferred locale
      operationId: updateLocale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/profile/theme:
    patch:
      tags: [Me]
      summary: Store the theme preference
      operationId: updateTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme_preference]
              properties:
                theme_preference: { $ref: '#/components/schemas/ThemePreference' }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Authenticated home data
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/programs:
    get:
      tags: [Programs]
      summary: List programs with the caller's enrollment state
      operationId: listPrograms
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Programs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Program' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/programs/{program}:
    get:
      tags: [Programs]
      summary: Program with its weekday-assigned templates
      operationId: getProgram
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProgramDetail' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/programs/{program}/enroll:
    post:
      tags: [Programs]
      summary: Enroll the caller in a program (idempotent)
      operationId: enrollProgram
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '204':
          description: Enrolled
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workout-templates/{id}:
    get:
      tags: [Workout Templates]
      summary: Workout template with activities and sets
      operationId: getWorkoutTemplate
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutTemplate' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/exercises:
    get:
      tags: [Exercises]
      summary: Exercise catalog for pickers (retired exercises excluded)
      operationId: listExercises
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Exercises sorted by localized name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/workouts:
    get:
      tags: [Workouts]
      summary: Caller's workout history, newest updated first, 20 per page
      operationId: listWorkouts
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated workouts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Workout' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Workouts]
      summary: Start a workout from a template
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workout_template_id]
              properties:
                workout_template_id: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/workouts/{workout}:
    get:
      tags: [Workouts]
      summary: Workout with activities and sets (owner only)
      operationId: getWorkout
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workouts]
      summary: Delete a workout (owner only)
      operationId: deleteWorkout
      parameters:
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workouts/{workout}/save:
    patch:
      tags: [Workouts]
      summary: Bulk-save activities and sets of an in-progress workout
      operationId: saveWorkout
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/WorkoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSaveRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/workouts/{workout}/complete:
    post:
      tags: [Workouts]
      summary: Mark a workout completed
      operationId: completeWorkout
      parameters:
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workouts/{workout}/repeat:
    post:
      tags: [Workouts]
      summary: Create a new in-progress copy of a workout (template link dropped)
      operationId: repeatWorkout
      parameters:
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '201':
          $ref: '#/components/responses/WorkoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Admin
  /api/v1/admin/equipment:
    get:
      tags: [Admin]
      summary: List equipment
      operationId: adminListEquipment
      responses:
        '200':
          description: Equipment
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Equipment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create equipment
      operationId: adminCreateEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentWrite' }
      responses:
        '201': { $ref: '#/components/responses/EquipmentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/equipment/{equipment}:
    parameters:
      - name: equipment
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Admin]
      summary: Show equipment
      operationId: adminGetEquipment
      responses:
        '200': { $ref: '#/components/responses/EquipmentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      summary: Update equipment
      operationId: adminUpdateEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentWrite' }
      responses:
        '200': { $ref: '#/components/responses/EquipmentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete equipment (refused while exercises reference it)
      operationId: adminDeleteEquipment
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/categories:
    get:
      tags: [Admin]
      summary: List categories
      operationId: adminListCategories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create category
      operationId: adminCreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '201': { $ref: '#/components/responses/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Admin]
      summary: Show category
      operationId: adminGetCategory
      responses:
        '200': { $ref: '#/components/responses/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      summary: Update category
      operationId: adminUpdateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '200': { $ref: '#/components/responses/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete category
      operationId: adminDeleteCategory
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/exercises:
