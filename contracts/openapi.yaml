  /api/v1/admin/programs:
    get:
      tags: [Admin]
      summary: List programs
      operationId: adminListPrograms
      responses:
        '200':
          description: Programs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProgram' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create program with weekday assignments
      operationId: adminCreateProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramWrite' }
      responses:
        '201': { $ref: '#/components/responses/AdminProgramResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/programs/{program}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      tags: [Admin]
      summary: Show program
      operationId: adminGetProgram
      responses:
        '200': { $ref: '#/components/responses/AdminProgramResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      summary: Update program and replace assignments
      operationId: adminUpdateProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramWrite' }
      responses:
        '200': { $ref: '#/components/responses/AdminProgramResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete program
      operationId: adminDeleteProgram
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token claims: `iss`, `aud`, `sub` (user id), `iat`, `exp`, `jti`,
        `auth_time` (seconds since epoch of the last password proof).

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred locale for translated content. Unsupported values fall back to `en`.
      schema: { type: string, example: ru }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-carried refresh tokens.
      schema: { type: string, enum: [XMLHttpRequest] }
    ProgramId:
      name: program
      in: path
      required: true
      schema: { type: integer }
    WorkoutId:
      name: workout
      in: path
      required: true
      schema: { type: integer }

  headers:
    RefreshCookie:
      description: |
        Web clients only. `refresh_token=<opaque>; HttpOnly; Secure; SameSite=Strict;
        Path=/api/v1/auth/refresh; Max-Age=<seconds>`
      schema: { type: string }
    ContentLanguage:
      description: Locale used for translated content in this response.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing:
              value: { message: Unauthenticated., code: unauthenticated }
            expired:
              value: { message: Access token expired., code: token_expired }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unverified:
              value: { message: Your email address is not verified., code: email_unverified }
            forbidden:
              value: { message: This action is unauthorized., code: forbidden }
    NotFound:
      description: Record not found or not owned by the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Record not found., code: not_found }
    Conflict:
      description: Operation refused because of existing references
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Equipment is in use by one or more exercises., code: in_use }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Too many attempts., code: too_many_requests }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    UserResponse:
      description: User
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/User' }
    WorkoutResponse:
      description: Workout
      headers:
        Content-Language: { $ref: '#/components/headers/ContentLanguage' }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Workout' }
    EquipmentResponse:
      description: Equipment
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Equipment' }
    CategoryResponse:
      description: Category
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Category' }
    ExerciseResponse:
      description: Exercise
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Exercise' }
    AdminWorkoutTemplateResponse:
      description: Workout template (admin view)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminWorkoutTemplate' }
    AdminProgramResponse:
      description: Program (admin view)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminProgram' }

  schemas:
    # ------------------------------------------------------------- Errors
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Localized, human-readable.
        code:
          type: string
          description: Stable, machine-readable, snake_case.
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [errors]
          properties:
            code:
              const: validation_failed
            errors:
              type: object
              description: Keyed by dot-notation field path, e.g. `activities.0.sets.1.effort_value`.
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                      description: Validation rule name, e.g. `required`, `email`, `unique`.
                    message:
                      type: string

    # ------------------------------------------------------------- Common
    Paginated:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: [integer, 'null'] }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: [integer, 'null'] }
            total: { type: integer }
    Locale:
      type: string
      enum: [en, ru]
    ThemePreference:
      type: string
      enum: [light, dark, system]
    ClientKind:
      type: string
      enum: [web, native]
      description: Decides whether the refresh token is delivered as a cookie (web) or in the body (native).
    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    EffortType:
      type: string
      enum: [repetitions, duration]
    DifficultyUnit:
      type: string
      enum: [kilograms, pounds, plates, heart_rate_zone, none]
    WorkoutStatus:
      type: string
      enum: [in_progress, completed]
    TranslationMap:
      type: object
      description: Raw per-locale values with no fallback; `null` means no translation stored.
      additionalProperties: { type: [string, 'null'] }
      example: { en: Chest, ru: Грудь }
    TranslationsWrite:
      type: object
      description: Blank values remove that locale's translation so reads fall back to English.
      required: [en]
      properties:
        en:
          type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 255 }
            description: { type: [string, 'null'], maxLength: 2000 }
        ru:
          type: object
          properties:
            name: { type: [string, 'null'], maxLength: 255 }
            description: { type: [string, 'null'], maxLength: 2000 }

    # ------------------------------------------------------------- Auth
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, client]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
        client: { $ref: '#/components/schemas/ClientKind' }
        device_name: { type: string, maxLength: 255 }
    LoginRequest:
      type: object
      required: [email, password, client]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        client: { $ref: '#/components/schemas/ClientKind' }
        device_name: { type: string, maxLength: 255 }
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        refresh_token:
          type: string
          description: Present for native clients only. Web clients receive it as a cookie.
        user: { $ref: '#/components/schemas/User' }

    # ------------------------------------------------------------- Users
    User:
      type: object
      required: [id, name, email, locale, theme_preference, is_admin]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        email: { type: string, format: email }
        locale: { $ref: '#/components/schemas/Locale' }
        theme_preference: { $ref: '#/components/schemas/ThemePreference' }
        is_admin: { type: boolean }
        email_verified:
          type: boolean
          description: Added in story 4.

    # ------------------------------------------------------------- Catalog
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        exercises_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
    CategoryWrite:
      type: object
      required: [translations]
      properties:
        translations: { $ref: '#/components/schemas/TranslationsWrite' }
    Equipment:
      type: object
      required: [id, name, difficulty_unit]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        exercises_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
    EquipmentWrite:
      type: object
      required: [difficulty_unit, translations]
      properties:
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        translations: { $ref: '#/components/schemas/TranslationsWrite' }
    Exercise:
      type: object
      required: [id, name, equipment_id, effort_type, effort_label, rest_time_seconds]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        description: { type: [string, 'null'], description: Localized. }
        equipment_id: { type: integer }
        equipment_name: { type: [string, 'null'] }
        effort_type: { $ref: '#/components/schemas/EffortType' }
        effort_label: { type: string }
        difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        difficulty_label: { type: string }
        rest_time_seconds: { type: [integer, 'null'] }
        category_ids:
          type: array
          items: { type: integer }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
            description: { $ref: '#/components/schemas/TranslationMap' }
    ExerciseWrite:
      type: object
      required: [equipment_id, effort_type, translations]
      properties:
        equipment_id: { type: integer }
        effort_type: { $ref: '#/components/schemas/EffortType' }
        rest_time_seconds: { type: [integer, 'null'], minimum: 0, maximum: 3600 }
        category_ids:
          type: array
          items: { type: integer }
        translations: { $ref: '#/components/schemas/TranslationsWrite' }

    # ------------------------------------------------------------- Programs and templates
    Program:
      type: object
      required: [id, name, is_enrolled]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        description: { type: [string, 'null'], description: Localized. }
        is_enrolled: { type: boolean }
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/Program'
        - type: object
          required: [workout_templates]
          properties:
            workout_templates:
              type: array
              items: { $ref: '#/components/schemas/WorkoutTemplate' }
    ProgramWrite:
      type: object
      required: [translations, assignments]
      properties:
        translations: { $ref: '#/components/schemas/TranslationsWrite' }
        assignments:
          type: array
          items:
            type: object
            required: [workout_template_id, weekday]
            properties:
              workout_template_id: { type: integer }
              weekday: { $ref: '#/components/schemas/Weekday' }
    AdminProgram:
      type: object
      required: [id, name, translations]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        templates_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
            description: { $ref: '#/components/schemas/TranslationMap' }
        assignments:
          type: array
          items:
            type: object
            required: [workout_template_id, workout_template_name, weekday, weekday_label]
            properties:
              workout_template_id: { type: integer }
              workout_template_name: { type: [string, 'null'] }
              weekday: { $ref: '#/components/schemas/Weekday' }
              weekday_label: { type: string }
    WorkoutTemplate:
      type: object
      required: [id, name, activities]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'], description: Localized. }
        description: { type: [string, 'null'], description: Localized. }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        pivot:
          type: object
          description: Present when the template is listed inside a program.
          required: [weekday, weekday_label]
          properties:
            weekday: { $ref: '#/components/schemas/Weekday' }
            weekday_label: { type: string }
    AdminWorkoutTemplate:
      type: object
      required: [id, name, translations]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        activities_count: { type: integer }
        translations:
          type: object
          properties:
            name: { $ref: '#/components/schemas/TranslationMap' }
            description: { $ref: '#/components/schemas/TranslationMap' }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
    WorkoutTemplateWrite:
      type: object
      required: [translations, activities]
      properties:
        translations: { $ref: '#/components/schemas/TranslationsWrite' }
        activities:
          type: array
          minItems: 1
          items:
            type: object
            required: [exercise_id, order, sets]
            properties:
              exercise_id: { type: integer }
              order: { type: integer, minimum: 1 }
              sets:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/SetWrite' }

    # ------------------------------------------------------------- Workouts
    Set:
      type: object
      required: [id, order, effort_value, difficulty_value, is_completed]
      properties:
        id: { type: integer }
        order: { type: integer }
        effort_value: { type: integer, description: Reps or seconds depending on the exercise effort type. }
        difficulty_value:
          type: [number, 'null']
          description: Weight, plates, or heart-rate zone 1-5 depending on the equipment difficulty unit; null when the unit is `none`.
        is_completed: { type: boolean }
    SetWrite:
      type: object
      required: [order, effort_value]
      properties:
        id: { type: [integer, 'null'], description: Omit or null to create. }
        order: { type: integer, minimum: 1 }
        effort_value: { type: integer, minimum: 0 }
        difficulty_value: { type: [number, 'null'], minimum: 0 }
        is_completed: { type: boolean }
    Activity:
      type: object
      required: [id, exercise_id, exercise_name, sets]
      properties:
        id: { type: integer }
        exercise_id: { type: [integer, 'null'] }
        exercise_name: { type: [string, 'null'], description: Localized; retired exercises still resolve. }
        rest_time_seconds: { type: [integer, 'null'] }
        exercise_equipment_name: { type: [string, 'null'] }
        exercise_effort_type: { $ref: '#/components/schemas/EffortType' }
        exercise_effort_label: { type: string }
        exercise_difficulty_unit: { $ref: '#/components/schemas/DifficultyUnit' }
        exercise_difficulty_label: { type: string }
        exercise_category_names:
          type: array
          items: { type: string }
        sets:
          type: array
          items: { $ref: '#/components/schemas/Set' }
    Workout:
      type: object
      required: [id, user_id, name, status, status_label, activities]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string, description: Copied from the template at creation; not re-translated. }
        status: { $ref: '#/components/schemas/WorkoutStatus' }
        status_label: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        activities_count: { type: [integer, 'null'] }
        workout_template:
          oneOf:
            - $ref: '#/components/schemas/WorkoutTemplate'
            - type: 'null'
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
    WorkoutSaveRequest:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          minItems: 1
          items:
            type: object
            required: [exercise_id, order, sets]
            properties:
              id: { type: [integer, 'null'], description: 'Existing activity id owned by this workout, or null to create.' }
              exercise_id: { type: integer }
              order: { type: integer, minimum: 1 }
              sets:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/SetWrite' }

    # ------------------------------------------------------------- Dashboard
    Dashboard:
      type: object
      required: [upcoming_schedule, in_progress_workout, recent_workouts, summary]
      properties:
        upcoming_schedule:
          type: array
          items:
            type: object
            required: [id, program_id, program_name, workout_template_id, workout_name, weekday, weekday_label, scheduled_at, scheduled_for]
            properties:
              id: { type: string, description: '`{program_id}-{workout_template_id}-{date}`' }
              program_id: { type: integer }
              program_name: { type: [string, 'null'] }
              workout_template_id: { type: integer }
              workout_name: { type: [string, 'null'] }
              weekday: { $ref: '#/components/schemas/Weekday' }
              weekday_label: { type: string }
              scheduled_at: { type: string, format: date-time }
              scheduled_for: { type: string, format: date }
        in_progress_workout:
          oneOf:
            - $ref: '#/components/schemas/Workout'
            - type: 'null'
        recent_workouts:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Workout' }
        summary:
          type: object
          required: [enrolled_programs_count, completed_workouts_count, completed_last_7_days_count, upcoming_workouts_count]
          properties:
            enrolled_programs_count: { type: integer }
            completed_workouts_count: { type: integer }
            completed_last_7_days_count: { type: integer }
            upcoming_workouts_count: { type: integer }
