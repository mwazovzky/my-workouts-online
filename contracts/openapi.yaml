  /api/v1/admin/workout-templates:
    get:
      tags: [Admin]
      summary: List workout templates
      operationId: adminListWorkoutTemplates
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminWorkoutTemplate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create workout template with activities and sets
      operationId: adminCreateWorkoutTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutTemplateWrite' }
      responses:
        '201': { $ref: '#/components/responses/AdminWorkoutTemplateResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/workout-templates/{workout_template}:
    parameters:
      - name: workout_template
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Admin]
      summary: Show workout template
      operationId: adminGetWorkoutTemplate
      responses:
        '200': { $ref: '#/components/responses/AdminWorkoutTemplateResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      summary: Replace workout template activities and sets
      operationId: adminUpdateWorkoutTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutTemplateWrite' }
      responses:
        '200': { $ref: '#/components/responses/AdminWorkoutTemplateResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete workout template (refused while a program uses it)
      operationId: adminDeleteWorkoutTemplate
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
