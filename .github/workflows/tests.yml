name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-php
    env:
      # Minimum backend line coverage (%). Raise as coverage improves; see docs/testing.md.
      BACKEND_MIN: 95

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo, mysql, dom, sodium
          coverage: pcov

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Setup Environment
        run: cp ../../.env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: >
          php artisan test --compact
          --coverage --min="${BACKEND_MIN}"
          --coverage-clover coverage.xml
          --coverage-html coverage-html

      - name: Coverage summary
        if: always()
        run: |
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            $m = $xml->project->metrics;
            $total = (int) $m["statements"];
            $covered = (int) $m["coveredstatements"];
            $pct = $total > 0 ? round($covered / $total * 100, 1) : 0.0;
            $color = match (true) {
              $pct >= 90 => "brightgreen",
              $pct >= 80 => "green",
              $pct >= 70 => "yellowgreen",
              $pct >= 60 => "yellow",
              $pct >= 50 => "orange",
              default => "red",
            };
            file_put_contents("coverage-badge.json", json_encode([
              "schemaVersion" => 1,
              "label" => "backend coverage",
              "message" => $pct . "%",
              "color" => $color,
            ]) . "\n");
            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), sprintf(
              "### Backend coverage\n\n**%s%%** lines covered (%d / %d), minimum %s%%\n",
              $pct, $covered, $total, getenv("BACKEND_MIN")
            ), FILE_APPEND);
          '

      - name: Upload PHP coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: |
            services/api-php/coverage.xml
            services/api-php/coverage-html
            services/api-php/coverage-badge.json

  web-tests:
    name: Web SPA Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const { total } = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const pct = Math.round(total.lines.pct * 10) / 10;
            const color =
              pct >= 90 ? "brightgreen" :
              pct >= 80 ? "green" :
              pct >= 70 ? "yellowgreen" :
              pct >= 60 ? "yellow" :
              pct >= 50 ? "orange" : "red";
            fs.writeFileSync("coverage/coverage-badge.json", JSON.stringify({
              schemaVersion: 1,
              label: "frontend coverage",
              message: `${pct}%`,
              color,
            }) + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Frontend coverage\n\n**${pct}%** lines covered (${total.lines.covered} / ${total.lines.total}), minimum set in vitest.config.js\n`);
          '

      - name: Build
        run: npm run build

      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage

  coverage-badges:
    name: Publish coverage badges
    runs-on: ubuntu-latest
    needs: [php-tests, web-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/coverage

      - name: Render badge SVGs
        run: |
          node -e '
            const fs = require("fs");
            const colors = {
              brightgreen: "#4c1", green: "#97ca00", yellowgreen: "#a4a61d",
              yellow: "#dfb317", orange: "#fe7d37", red: "#e05d44",
            };
            const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
            const width = (s) => Math.round(s.length * 6.5) + 10;
            const render = ({ label, message, color }) => {
              const lw = width(label), vw = width(message), w = lw + vw;
              const fill = colors[color] || colors.red;
              return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="20" role="img" aria-label="${esc(label)}: ${esc(message)}">
            <title>${esc(label)}: ${esc(message)}</title>
            <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
            <clipPath id="r"><rect width="${w}" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="${lw}" height="20" fill="#555"/>
              <rect x="${lw}" width="${vw}" height="20" fill="${fill}"/>
              <rect width="${w}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="${lw / 2}" y="15" fill="#010101" fill-opacity=".3">${esc(label)}</text>
              <text x="${lw / 2}" y="14">${esc(label)}</text>
              <text x="${lw + vw / 2}" y="15" fill="#010101" fill-opacity=".3">${esc(message)}</text>
              <text x="${lw + vw / 2}" y="14">${esc(message)}</text>
            </g>
          </svg>
          `;
            };
            const dir = process.env.RUNNER_TEMP + "/coverage";
            for (const [artifact, name] of [["php-coverage", "backend"], ["web-coverage", "frontend"]]) {
              const data = JSON.parse(fs.readFileSync(`${dir}/${artifact}/coverage-badge.json`, "utf8"));
              fs.writeFileSync(`${dir}/${name}.svg`, render(data));
            }
          '

      - name: Commit badges to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges:badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rfq .
          fi
          cp "${RUNNER_TEMP}/coverage/backend.svg" backend.svg
          cp "${RUNNER_TEMP}/coverage/frontend.svg" frontend.svg
          git add backend.svg frontend.svg
          if git diff --cached --quiet; then
            echo "Badges unchanged"
            exit 0
          fi
          git commit -m "chore: update coverage badges for ${GITHUB_SHA::7}"
          git push origin badges
