name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-php

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo, mysql, dom, sodium
          coverage: xdebug

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Setup Environment
        run: cp ../.env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: php artisan test --coverage-clover coverage.xml

      - name: Upload PHP coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: services/api-php/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/api-php/coverage.xml
          flags: backend
          name: backend-coverage
          disable_search: true
          fail_ci_if_error: true

  web-tests:
    name: Web SPA Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload web coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage

      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/web/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          disable_search: true
          fail_ci_if_error: true
