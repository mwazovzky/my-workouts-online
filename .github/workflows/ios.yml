name: ios

on:
  push:
    branches:
      - main
    tags:
      - 'ios-v*' # iOS releases; deploy.yml only listens to v*, so these never deploy the web and API
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the PR's changed files through the API

jobs:
  # Cheap Linux job that decides whether the macOS job runs. A job skipped through
  # `if:` still satisfies branch protection, so `ios / build-and-test` can be a
  # required check without spending macOS minutes on unrelated changes.
  changes:
    name: Detect iOS changes
    # Only PRs and branch pushes are filtered; tags and manual runs always build.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Branch pushes compare against main; PRs compare against their own base, and
          # passing `base` there only earns an "input ignored" warning.
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          filters: |
            ios:
              - 'apps/ios/**'
              - 'contracts/openapi.yaml'
              - '.github/workflows/ios.yml'

  build-and-test:
    name: Build and test
    needs: changes
    # Runs for iOS-related changes, and always for release tags and manual dispatch.
    if: always() && (needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v'))
    runs-on: macos-26
    env:
      # Release tags and manual runs also run the XCUITest smoke suite; PRs skip it to save macOS minutes.
      SKIP_UI_TESTS: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')) && '' || '-skip-testing:MyWorkoutsUITests' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      # Build caches are only valid for the compiler that produced them, so the
      # Xcode build number is part of every cache key below.
      - name: Read Xcode version
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      # `swift test` products of the local packages: the OpenAPI runtime, generator
      # plugin and HTTP types compile once per dependency set instead of every run.
      - name: Cache package builds
        uses: actions/cache@v6
        with:
          path: apps/ios/Packages/*/.build
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('apps/ios/Packages/*/Package.swift', 'apps/ios/Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      # The app build's DerivedData (fixed path, see App tests): checked-out
      # dependencies and their compiled products. Our own sources are newer than
      # the cache after checkout, so they always recompile; only unchanged
      # dependencies are reused.
      - name: Cache Xcode build
        uses: actions/cache@v6
        with:
          path: |
            apps/ios/DerivedData/SourcePackages
            apps/ios/DerivedData/Build
            apps/ios/DerivedData/ModuleCache.noindex
          key: xcode-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('apps/ios/Packages/*/Package.swift', 'apps/ios/Packages/*/Package.resolved', 'apps/ios/project.yml') }}
          restore-keys: xcode-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      - name: Lint
        run: swift format lint --strict --recursive apps/ios

      - name: Package tests
        run: |
          (cd apps/ios/Packages/WorkoutsCore && swift test)
          (cd apps/ios/Packages/WorkoutsAPI && swift test)

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(devices[-1]["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: App tests
        run: |
          xcodebuild test \
            -project apps/ios/MyWorkouts.xcodeproj \
            -scheme MyWorkouts \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            $SKIP_UI_TESTS \
            -derivedDataPath apps/ios/DerivedData \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --quiet || exit ${PIPESTATUS[0]}

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults.xcresult
