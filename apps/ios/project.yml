# XcodeGen project definition. The .xcodeproj is generated (git-ignored):
#   brew install xcodegen && xcodegen generate
# Build settings live in Config/*.xcconfig, not here.
name: MyWorkouts
options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  WorkoutsCore:
    path: Packages/WorkoutsCore
  WorkoutsAPI:
    path: Packages/WorkoutsAPI
targets:
  MyWorkouts:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: App/MyWorkouts.entitlements
      properties:
        # Universal Links for the emailed verify-email and reset-password URLs. The AASA file
        # at https://my-workouts.online/.well-known/apple-app-site-association is rendered by
        # docker/web/start.sh from APPLE_APP_ID (TEAMID.online.my-workouts.app).
        com.apple.developer.associated-domains:
          - applinks:my-workouts.online
    dependencies:
      - package: WorkoutsCore
      - package: WorkoutsAPI
    scheme:
      testTargets:
        - MyWorkoutsTests
        - MyWorkoutsUITests
      gatherCoverageData: true
  MyWorkoutsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MyWorkoutsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.my-workouts.app.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MyWorkouts
  MyWorkoutsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/MyWorkoutsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.my-workouts.app.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MyWorkouts
