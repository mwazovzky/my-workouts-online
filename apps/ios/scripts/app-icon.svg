  <defs>
    <linearGradient id="background" x1="0.32" y1="0" x2="0.68" y2="1">
      <stop offset="0" stop-color="#3a8ae6"/>
      <stop offset="1" stop-color="#1b4fae"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#background)"/>
  <g transform="translate(64 64) scale(0.96) translate(-64 -64)" color="#ffffff">
    <circle cx="64" cy="64" r="51" fill="none" stroke="currentColor" stroke-width="12" opacity="0.22"/>
    <path d="M64 13a51 51 0 1 1-51 51" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="12"/>
    <g transform="translate(64 64) scale(0.665) translate(-64 -64)" fill="currentColor">
      <rect x="5" y="58.5" width="10" height="11" rx="4"/>
      <rect x="113" y="58.5" width="10" height="11" rx="4"/>
      <rect x="12" y="44" width="11" height="40" rx="5.5"/>
      <rect x="25" y="36" width="11" height="56" rx="5.5"/>
      <rect x="38" y="28" width="11" height="72" rx="5.5"/>
      <rect x="46" y="57" width="36" height="14" rx="5"/>
      <rect x="79" y="28" width="11" height="72" rx="5.5"/>
      <rect x="92" y="36" width="11" height="56" rx="5.5"/>
      <rect x="105" y="44" width="11" height="40" rx="5.5"/>
    </g>
  </g>
</svg>
