# swift-openapi-generator build plugin configuration. Generated sources are never
# committed; the contract (symlinked openapi.yaml) is the single source of truth.
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
filter:
  tags:
    - Auth
    - Me
    - Meta
    - Dashboard
    - Programs
    - Workout Templates
    - Exercises
    - Workouts
